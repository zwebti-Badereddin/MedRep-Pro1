<script>
(window.__parts=window.__parts||[]).push("App1");

/* All lookups, branding and data now come from the server (Google Sheets) */
let CFG={company:{name:"",short:"",color:"#0b6b6f",title:"",prefix:"MR"},doctors:[],specialties:[],workplaces:[],products:[],samples:["—"]},TOKEN=null;
let NB=0;const bz=()=>{const e=document.getElementById("busy");if(e)e.style.display=NB?"block":"none"};
function srv(a,p){NB++;bz();return _srv(a,p).finally(()=>{NB--;bz()})}
function _srv(a,p){return new Promise((res,rej)=>google.script.run.withSuccessHandler(r=>r&&r.ok?res(r.data):rej(new Error(r?r.error:"خطأ في الاتصال"))).withFailureHandler(e=>rej(new Error((e&&e.message)||"تعذر الاتصال بالخادم"))).api(TOKEN,a,p||{}))}
const mapRep=r=>({id:r.id,reopens:r.reopens,notes:r.notes||"",docs:r.doctors||[],phs:r.pharmacies||[],status:r.status,no:r.no,date:r.date});
function applyBoot(b){const st=b.settings,u=a=>a.filter((x,i)=>x&&a.indexOf(x)===i);
 CFG.company={name:st.companyName||"",short:st.shortName||"",color:st.brandColor||"#0b6b6f",title:st.reportTitle||"",prefix:st.reportPrefix||"MR",phone:st.phone||"",address:st.address||"",logo:st.logo||""};
 CFG.doctors=b.doctors.map(d=>d.name);CFG.docs=b.doctors;CFG.facilities=b.facilities||[];CFG.phs=b.pharmacies;CFG.specialties=u(b.doctors.map(d=>d.specialty));if(!CFG.specialties.length)CFG.specialties=["باطنة","قلب","أطفال"];
 CFG.workplaces=u(b.doctors.map(d=>d.workplace));if(!CFG.workplaces.length)CFG.workplaces=["—"];
 CFG.products=b.products.map(p=>p.name);CFG.samples=["—"].concat(CFG.products);
 CFG.st=st;document.documentElement.style.setProperty("--brand",CFG.company.color)}
const locked=()=>S&&["مسودة","معاد للمندوب"].indexOf(S.status)<0;
// Each save belongs to the report context in which it was created.
let saveChain=Promise.resolve(),reportContextSeq=0;
function saveNow(){
 if(!S)return Promise.reject(new Error("لا يوجد تقرير للحفظ"));
 if(typeof cancelAuto==="function")cancelAuto();
 const target=S,context=reportContextSeq,targetId=target.id||null,targetDate=target.date;
 const payload=JSON.parse(JSON.stringify({date:targetDate,notes:target.notes,doctors:target.docs,pharmacies:target.phs}));
 const task=saveChain.catch(()=>{}).then(()=>srv("saveReport",payload)).then(r=>{
  // A delayed response may update UI state only if its original report is still active.
  if(reportContextSeq===context&&S===target&&S.date===targetDate&&(S.id||null)===targetId){
   S.no=r.no;S.status=r.status;
   (r.docs||[]).forEach((v,i)=>{if(S.docs[i]&&S.docs[i].name===v.name)S.docs[i].gps=v.gps});
   (r.phs||[]).forEach((v,i)=>{if(S.phs[i]&&S.phs[i].name===v.name)S.phs[i].gps=v.gps});
  }
  return r
 });
 saveChain=task;
 return task
}
/* GPS: captured silently while the visit form is open; verdict is computed on the server */
let GEO=null,GW=null,GEO_FAILED=false;
function startGeo(){GEO=null;GEO_FAILED=false;stopGeo();if(!navigator.geolocation){GEO_FAILED=true;showGeo();return}try{GW=navigator.geolocation.watchPosition(p=>{if(!GEO||p.coords.accuracy<=GEO.acc+1||p.timestamp-GEO.ts>8000)GEO={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy),ts:p.timestamp};GEO_FAILED=false;showGeo()},()=>{GEO_FAILED=true;showGeo()},{enableHighAccuracy:true,maximumAge:0,timeout:20000})}catch(e){GEO_FAILED=true;showGeo()}}
function stopGeo(){try{if(GW!=null)navigator.geolocation.clearWatch(GW)}catch(e){}GW=null}
function showGeo(){const e=$("#geo");if(e)e.textContent=GEO?"✓ تم تحديد موقعك":GEO_FAILED?"لم يتم التحقق من الموقع":"… جارٍ تحديد الموقع"}
function consent(){try{if(localStorage.getItem("mr_gps_ok"))return}catch(e){}
 $("#modal").innerHTML='<h3>تسجيل الموقع</h3><p style="line-height:1.8">يسجّل النظام موقعك عند إضافة كل زيارة للتحقق من وجودك في مكانها، ولا يطّلع عليه إلا المدير. سيطلب الهاتف إذن الموقع، فاختر «السماح». لا يمنع غياب الموقع حفظ الزيارة.</p><button class="btn pri full" id="okc">موافق</button>';
 $("#ov").classList.add("on");$("#okc").onclick=()=>{try{localStorage.setItem("mr_gps_ok","1")}catch(e){}$("#ov").classList.remove("on");startGeo();setTimeout(stopGeo,4000)}}
const $=s=>document.querySelector(s),esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
let rep=null,S=null;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),5000)}
function dateInfo(ds){const d=ds?new Date(ds+"T12:00:00"):new Date(),p=n=>String(n).padStart(2,"0");return{day:DAYS[d.getDay()],date:`${p(d.getDate())} / ${p(d.getMonth()+1)} / ${d.getFullYear()}`}}

let REPS=[],STAT=[],CUR=null,PREV=null,TD=null,RO=false;
function login(adm){
 const staleGpsButton=$("#pvgeo");if(staleGpsButton)staleGpsButton.remove();if(typeof clearVisitGpsMap==="function")clearVisitGpsMap();
 $("#app").innerHTML=`<div class="login"><div class="box"><div class="mk lg">✚</div><h1>MedRep Pro</h1><div style="color:var(--mut)">${adm?"دخول الإدارة":"أدخل رمز الدخول المكوّن من 5 أرقام"}</div>
 ${adm?'<input id="admin_user" autocomplete="username" style="font-size:16px" aria-label="اسم المستخدم" placeholder="اسم المستخدم"><input id="code" type="password" autocomplete="current-password" style="letter-spacing:0;font-size:18px;margin-top:8px" aria-label="كلمة المرور" placeholder="كلمة المرور">':'<input id="code" inputmode="numeric" maxlength="5" autocomplete="off" aria-label="رمز الدخول">'}
 <div class="err" id="err"></div><button class="btn pri full" id="go">دخول</button>
 <a href="#" id="sw" style="display:block;text-align:center;margin-top:16px;color:var(--brand);padding:8px">${adm?"دخول المندوب":"دخول الإدارة"}</a></div></div>`;
 $("#sw").onclick=e=>{e.preventDefault();login(!adm)};
 const go=async()=>{const b=$("#go");b.disabled=true;b.textContent="جارٍ الدخول…";$("#err").textContent="";
  try{const r=await srv("login",adm?{role:"admin",username:$("#admin_user").value.trim(),password:$("#code").value}:{code:$("#code").value.trim()});TOKEN=r.token;rep=r.user;applyBoot(r.boot);srv("loginAudit").catch(()=>{});
   if(adm){REPS=r.boot.reps||[];STAT=r.boot.statuses;adminHome()}else{S=mapRep(r.report);PREV=r.prev;TD=S.date;home();consent()}}
  catch(e){$("#err").textContent=e.message;b.disabled=false;b.textContent="دخول"}};
 $("#go").onclick=go;$("#code").onkeydown=e=>{if(e.key==="Enter")go()};if(adm){$("#admin_user").onkeydown=e=>{if(e.key==="Enter")$("#code").focus()};$("#admin_user").focus()}else $("#code").focus();
}
/* ===== Admin ===== */
const pad=n=>String(n).padStart(2,"0"),isoD=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
let adminNavSeq=0;
function adminHome(){
 const n=new Date();
 $("#app").innerHTML=`<div class="top"><div class="brandrow">${CFG.company.logo?`<img class="mk" src="${esc(CFG.company.logo)}" alt="" style="width:auto;max-width:88px;height:56px;object-fit:contain">`:`<span class="mk">${esc(CFG.company.short)}</span>`}<span class="co">${esc(CFG.company.name)}</span><a href="#" id="lo">خروج</a></div><h2 style="margin-top:14px">لوحة الإدارة</h2></div>
 <div class="tabs"><button class="btn" data-t="r">التقارير</button><button class="btn" data-t="p">الأداء</button><button class="btn" data-t="c">المقارنة</button><button class="btn" data-t="m">السجلات</button><button class="btn" data-t="s">الإعدادات</button></div>
 <div class="wrap"><div class="two"><div><label>من</label><input type="date" id="fa" value="${isoD(new Date(n.getFullYear(),n.getMonth(),1))}"></div><div><label>إلى</label><input type="date" id="fb" value="${isoD(n)}"></div></div><div id="av" style="margin-top:6px"></div></div>`;
 $("#lo").onclick=async e=>{e.preventDefault();try{await srv("logout")}catch(x){}TOKEN=null;login()};
 const show=t=>{adminNavSeq++;if(t!=="s"&&typeof settingsViewSeq==="number")settingsViewSeq++;document.querySelectorAll(".tabs .btn").forEach(b=>b.classList.toggle("on",b.dataset.t===t));({r:tabR,p:tabP,c:tabC,m:tabM,s:tabSet})[t]()};
 document.querySelectorAll(".tabs .btn").forEach(b=>b.onclick=()=>show(b.dataset.t));show("r");
}
function tabSetLegacy(){
 const st=CFG.st||{};
 $("#av").innerHTML=`<h3 style="margin:4px 0 12px">الشركة والنظام</h3>
 <label>اسم الشركة</label><input id="c_n" value="${esc(st.companyName||"")}">
 <div class="two"><div><label>اختصار الشعار</label><input id="c_s" maxlength="3" value="${esc(st.shortName||"")}"></div>
 <div><label>لون الهوية</label><input id="c_c" type="color" style="padding:4px" value="${esc(st.brandColor||"#0b6b6f")}"></div></div>
 <label>عنوان التقرير</label><input id="c_t" value="${esc(st.reportTitle||"")}">
 <label>هاتف الشركة</label><input id="c_p" value="${esc(st.phone||"")}">
 <label>عنوان الشركة</label><input id="c_a" value="${esc(st.address||"")}">
 <label>رابط الشعار (Google Drive أو رابط صورة مباشر)</label><input id="c_logo_url" type="url" dir="ltr" placeholder="https://drive.google.com/file/d/..." value="${esc(st.logo||"")}">
 <div style="display:flex;gap:10px;align-items:center;margin:8px 0 14px"><img id="c_img" alt="معاينة الشعار" style="height:72px;max-width:220px;object-fit:contain;display:${st.logo?"block":"none"}" src="${esc(st.logo||"")}"><button class="mini" id="c_logo_save" type="button">حفظ رابط الشعار</button><button class="mini" id="c_rm" type="button">إزالة الشعار</button></div>
 <label>بريد استلام التقارير (يفصل بينها بفاصلة)</label><input id="s_e" type="text" value="${esc(st.reportEmail||"")}">
 <label>ساعة إغلاق التقرير</label><input id="s_h" type="number" min="0" max="23" value="${esc(st.closeHour===undefined?10:st.closeHour)}">
 <label>أيام العمل (0 الأحد … 6 السبت)</label><input id="s_w" value="${esc(st.workDays||"0,1,2,3,4")}">
 <label>نطاق التحقق من الموقع (بالمتر)</label><input id="s_g" type="number" min="20" value="${esc(st.gpsRadius||150)}">
 <button class="btn pri full" id="c_save" style="margin-top:14px">حفظ إعدادات الشركة والنظام</button>
 <div class="empty" style="margin-top:8px">لروابط Google Drive، اجعل الوصول إلى الصورة «أي شخص لديه الرابط».</div>`;
 const logo=$("#c_logo_url"),img=$("#c_img");
 const preview=()=>{const u=logo.value.trim();img.src=u;img.style.display=u?"block":"none"};
 logo.oninput=preview;
 $("#c_logo_save").onclick=async()=>{try{const url=await srv("saveLogo",{url:logo.value.trim()});logo.value=url;st.logo=url;CFG.company.logo=url;preview();toast("تم حفظ رابط الشعار")}catch(e){toast(e.message)}};
 $("#c_rm").onclick=async()=>{try{await srv("saveLogo",{url:""});logo.value="";st.logo="";CFG.company.logo="";preview();toast("تمت إزالة الشعار")}catch(e){toast(e.message)}};
 $("#c_save").onclick=async()=>{try{
  const values={companyName:$("#c_n").value.trim(),shortName:$("#c_s").value.trim(),brandColor:$("#c_c").value,reportTitle:$("#c_t").value.trim(),phone:$("#c_p").value.trim(),address:$("#c_a").value.trim(),reportEmail:$("#s_e").value.trim(),closeHour:$("#s_h").value,workDays:$("#s_w").value.replace(/\s/g,""),gpsRadius:$("#s_g").value};
  await srv("saveSettings",{values});
  const logoUrl=await srv("saveLogo",{url:logo.value.trim()});
  Object.assign(st,values,{logo:logoUrl});CFG.st=st;
  CFG.company={name:values.companyName,short:values.shortName,color:values.brandColor,title:values.reportTitle,phone:values.phone,address:values.address,logo:logoUrl,prefix:CFG.company.prefix||"MR"};
  document.documentElement.style.setProperty("--brand",values.brandColor);
  toast("تم حفظ إعدادات الشركة والنظام");
 }catch(e){toast("تعذر حفظ الإعدادات: "+e.message)}};
}

function tabR(){
 $("#av").innerHTML=`<div class="two"><div><label>المندوب</label><select id="fr"><option value="">الكل</option>${REPS.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join("")}</select></div>
 <div><label>الحالة</label><select id="fs"><option value="">الكل</option>${STAT.map(x=>`<option>${x}</option>`).join("")}</select></div></div>
 <label>بحث: رقم التقرير أو طبيب أو صيدلية أو منتج</label><input id="fq"><button class="btn pri full" id="fgo" style="margin:12px 0">بحث</button><div id="rl"></div>`;
 $("#fgo").onclick=async()=>{const nav=adminNavSeq,q=$("#fq").value.trim(),isNo=/^[A-Za-z]+-|^\d{4,}$/.test(q);
  try{const a=await srv("listReports",{from:$("#fa").value,to:$("#fb").value,repId:$("#fr").value,status:$("#fs").value,no:isNo?q:"",q:isNo?"":q});
   if(nav!==adminNavSeq||!$("#rl"))return;$("#rl").innerHTML=a.length?a.map(r=>`<div class="row" data-id="${esc(r.id)}" style="cursor:pointer"><div class="t"><b>${esc(r.no)}</b><small>${esc(r.repName)} · ${esc(r.date)} · ${r.visits} زيارة${r.reopens?" · معدّل بعد الإرسال":""}</small></div><span class="st s${STAT.indexOf(r.status)}">${esc(r.status)}</span><div class="acts">${r.status==="مرسل"?`<button class="mini" type="button" data-a="gps" data-id="${esc(r.id)}">مطابقة الموقع</button>`:""}</div></div>`).join(""):'<div class="empty">لا توجد تقارير مطابقة.</div>';
   document.querySelectorAll("#rl .row").forEach(e=>e.onclick=()=>openRep(e.dataset.id));
   document.querySelectorAll('#rl button[data-a="gps"]').forEach(b=>b.onclick=async e=>{e.stopPropagation();const id=b.dataset.id;await openRep(id);if(CUR&&CUR.id===id)openGpsComparison()})}catch(e){toast(e.message)}};
 $("#fgo").click();
}
const coOf=c=>({name:c.companyName||c.name||CFG.company.name,short:c.shortName||c.short||CFG.company.short,color:c.brandColor||c.color||CFG.company.color,title:c.reportTitle||c.title||CFG.company.title,phone:c.phone!==undefined?c.phone:CFG.company.phone,address:c.address!==undefined?c.address:CFG.company.address,logo:CFG.company.logo});
async function openRep(id){
 const nav=adminNavSeq;
 try{const r=await srv("getReport",{id});if(nav!==adminNavSeq)return;CUR=r;const x=r.snapshot||{company:{},no:r.no,rep:(REPS.find(y=>y.id===r.repId)||{}).name,date:r.date,notes:r.notes,doctors:r.doctors,pharmacies:r.pharmacies};
  const draw=x=>render({adm:true,company:coOf(x.company||{}),no:x.no,rep:x.rep,day:DAYS[new Date(x.date+"T12:00:00").getDay()],date:x.date.split("-").reverse().join(" / "),notes:x.notes,docs:x.doctors,phs:x.pharmacies});CUR.draw=draw;CUR.x0=x;CUR.first=false;$("#stage").innerHTML=draw(x);$("#pv1").style.display=r.snapshot1?"":"none";$("#pv1").textContent="النسخة الأولى";
  $("#pvsend").style.display=$("#pvs").style.display="none";$("#pvok").style.display=$("#pvret").style.display=r.status==="مرسل"?"":"none";
  installGpsCompareButton(r);$("#pv").classList.add("on");fit()}catch(e){toast(e.message)}
}

function installGpsCompareButton(report){
 const old=$("#pvgeo");if(old)old.remove();
 const visits=(report.doctors||[]).length+(report.pharmacies||[]).length;if(!visits)return;
 const bar=document.querySelector(".pvbar");if(!bar)return;
 const b=document.createElement("button");b.id="pvgeo";b.className="btn";b.type="button";b.textContent="مقارنة موقع الزيارة";
 b.onclick=openGpsComparison;bar.insertBefore(b,$("#pvok"));
}
function collectGpsCompareVisits(report){
 const doctors=(report&&report.doctors)||[],pharmacies=(report&&report.pharmacies)||[];
 return doctors.map((v,i)=>({kind:"زيارة طبيب",type:"doctor",name:v.name||"طبيب غير محدد",doctorName:v.name||"",doctorId:v.doctorId||"",workplaceId:v.workplaceId||"",place:v.place||"",gps:v.gps||{},seq:i+1}))
  .concat(pharmacies.map((v,i)=>({kind:"زيارة صيدلية",type:"pharmacy",name:v.name||"صيدلية غير محددة",pharmacyId:v.pharmacyId||"",place:v.loc||"",gps:v.gps||{},seq:i+1})));
}
let visitCompareMapInstance=null,visitGpsDrawSeq=0;
function clearVisitGpsMap(){
 if(visitCompareMapInstance){try{visitCompareMapInstance.remove()}catch(e){}visitCompareMapInstance=null}
}
function closeVisitGpsComparison(){
 visitGpsDrawSeq++;clearVisitGpsMap();const ov=$("#ov");if(ov)ov.classList.remove("on");
}
function gpsPointValid(lat,lng){
 return lat!==""&&lat!=null&&lng!==""&&lng!=null&&isFinite(+lat)&&isFinite(+lng)&&+lat>=-90&&+lat<=90&&+lng>=-180&&+lng<=180;
}
function gpsDistanceMeters(lat1,lng1,lat2,lng2){
 const rad=n=>n*Math.PI/180, dLat=rad(lat2-lat1), dLng=rad(lng2-lng1);
 const a=Math.sin(dLat/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLng/2)**2;
 return 6371000*2*Math.atan2(Math.sqrt(Math.max(0,a)),Math.sqrt(Math.max(0,1-a)));
}
function openGpsComparison(){
 const visits=collectGpsCompareVisits(CUR);
 if(!visits.length){toast("لا توجد زيارات في هذا التقرير.");return}
 clearVisitGpsMap();
 const options=visits.map((v,i)=>`<option value="${i}">${esc(v.kind+" "+v.seq+" — "+v.name+(v.place?" · "+v.place:""))}</option>`).join("");
 $("#modal").innerHTML=`<h3>مقارنة موقع الزيارة</h3>
  <div class="empty" style="margin:8px 0;color:var(--mut)">هذه المعلومات للتحقق والمراجعة فقط، وليست دليلًا على التقصير أو الإهمال.</div>
  <label for="vgVisit">اختر الزيارة</label><select id="vgVisit">${options}</select>
  <div id="vgSummary" style="font-size:13px;line-height:1.8;margin:8px 0"></div>
  <div id="visitGpsMap" style="display:none;height:340px;min-height:260px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft)"></div>
  <div id="visitGpsMapMsg" class="empty" style="margin-top:8px">جارٍ تجهيز بيانات الموقع…</div>
  <div style="display:flex;justify-content:space-between;gap:8px;margin-top:12px"><button class="btn" id="vgClose" type="button">إغلاق</button><span style="font-size:11px;color:var(--mut);align-self:center">الأحمر: موقع المندوب · الأزرق: موقع المنشأة المعتمد</span></div>`;
 $("#ov").classList.add("on");
 $("#vgClose").onclick=closeVisitGpsComparison;
 $("#vgVisit").onchange=()=>drawGpsComparisonVisit(visits[+$("#vgVisit").value]);
 drawGpsComparisonVisit(visits[0]);
}
function drawGpsComparisonVisit(v){
 const drawSeq=++visitGpsDrawSeq;clearVisitGpsMap();
 const g=v.gps||{};
 let rawRef=g.reference||(g.recheck&&g.recheck.reference)||v.currentReference||null;
 const validRef=x=>!!x&&x.source==="ADMIN_MAP"&&x.state==="مؤكد"&&gpsPointValid(x.lat,x.lng);
 const repOk=gpsPointValid(g.lat,g.lng);
 if(!validRef(rawRef)&&!v._refRequested){
  v._refRequested=true;
  const request={kind:v.type,name:v.name,doctorName:v.doctorName||"",doctorId:v.doctorId||"",workplaceId:v.workplaceId||"",place:v.place||"",pharmacyId:v.pharmacyId||""};
  srv("gpsReference",request).then(ref=>{
   v.currentReference=ref||null;
   v.currentReferenceError=ref?"": "لم يُرجع الخادم موقعًا معتمدًا لهذه الزيارة. تحقق من ربط الطبيب بمكان العمل ومن اعتماد موقع المنشأة في الإدارة.";
   drawGpsComparisonVisit(v);
  }).catch(err=>{
   v.currentReference=null;
   v.currentReferenceError="تعذر استرجاع مرجع المنشأة من الخادم: "+((err&&err.message)||"خطأ غير معروف");
   drawGpsComparisonVisit(v);
  });
 }
 const refOk=validRef(rawRef);
 const status=g.status||"غير متاح";
 const dist=repOk&&refOk?"المسافة بين الموقعين: "+Math.round(gpsDistanceMeters(+g.lat,+g.lng,+rawRef.lat,+rawRef.lng))+" متر":"لا يمكن حساب المسافة دون إحداثيات صالحة للموقعين";
 const accuracy=g.acc!==""&&g.acc!=null&&isFinite(+g.acc)?"دقة GPS المعلنة: ±"+Math.round(+g.acc)+" متر":"دقة GPS: غير متاحة";
 let when="وقت التقاط الموقع: غير متاح";
 if(g.ts){let ms=typeof g.ts==="number"?g.ts:Number(g.ts);if(isFinite(ms)){if(ms<1000000000000)ms*=1000}else ms=Date.parse(String(g.ts));if(isFinite(ms))when="وقت التقاط الموقع: "+new Date(ms).toLocaleString("ar-LY")}
 const referenceMessage=refOk?"تم استرجاع موقع المنشأة المعتمد.":(v.currentReferenceError|| (v._refRequested?"جارٍ استرجاع مرجع المنشأة…":""));
