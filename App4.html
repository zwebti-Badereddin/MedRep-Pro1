<script>
(window.__parts=window.__parts||[]).push("App4");
/* ===== Rep screens: my reports, my performance ===== */
const SC={"مسودة":"s0","جاهز للمراجعة":"s1","مرسل":"s2","معتمد":"s3","معاد للمندوب":"s4"};
let repScreenSeq=0;
/* Rep screens: white header (logo, company, rep, optional save state), stat cards, bottom dock with the navigation. */
const svgI=(d,s)=>'<svg width="'+(s||18)+'" height="'+(s||18)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';
const IC={
 doc:svgI('<circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path>'),
 ph:svgI('<rect x="4" y="7" width="16" height="13" rx="2"></rect><path d="M9 7V4h6v3M12 11v5M9.5 13.5h5"></path>'),
 ok:svgI('<path d="M4 12l5 5L20 6"></path>'),
 check:svgI('<path d="M20 6 9 17l-5-5"></path>',14),
 pin:svgI('<path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"></path><circle cx="12" cy="10" r="2"></circle>',13),
 nopin:svgI('<path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"></path><path d="M4 4l16 16"></path>',13),
 plus:svgI('<path d="M12 5v14M5 12h14"></path>'),
 clock:svgI('<circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>',14),
 more:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>',
 t:svgI('<rect x="3" y="4" width="18" height="17" rx="3"></rect><path d="M3 9h18M8 2v4M16 2v4"></path>',22),
 h:svgI('<path d="M8 6h13M8 12h13M8 18h13"></path><circle cx="4" cy="6" r="1"></circle><circle cx="4" cy="12" r="1"></circle><circle cx="4" cy="18" r="1"></circle>',22),
 p:svgI('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path>',22),
 d:svgI('<circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 3-5.5 6.5-5.5s6.5 1.9 6.5 5.5"></path><path d="M16 4.5h5M16 9h5M18 13.5h3"></path>',22)
};
function repTop(t,o){
 o=o||{};const logo=CFG.company.logo?'<span class="lg"><img src="'+esc(CFG.company.logo)+'" alt=""></span>':'<span class="lg">'+esc(CFG.company.short)+'</span>';
 return '<header class="rhd"><div class="r1">'+logo+'<div class="who"><small>'+esc(CFG.company.name)+'</small><b>'+esc(rep.name)+'</b></div>'+(o.save?'<button type="button" id="savest" class="savest"></button>':'')+nfBell()+'<button type="button" class="out" id="lo">خروج</button></div>'+
  '<div class="r2"><div style="flex:1;min-width:0"><h1>'+t+'</h1>'+(o.sub?'<div class="dt">'+esc(o.sub)+'</div>':'')+'</div>'+(o.chip?'<span class="stchip">'+esc(o.chip)+'</span>':'')+'</div></header>';
}
/* Telegram alerts: the bell shows only when the company has a bot (settings.tgBot). Linking: a one-time t.me link,
   Start in Telegram, then «تحقق». The server reads Telegram's messages; nothing is sent from the phone to Telegram. */
const tgOn=()=>!!(CFG.st&&CFG.st.tgBot);
function tgBell(){return tgOn()?'<button type="button" class="tgb" id="tgb" aria-label="تنبيهات تيليجرام" title="تنبيهات تيليجرام">🔔</button>':""}
function tgBind(){document.querySelectorAll("#tgb").forEach(b=>{b.onclick=tgOpen});document.querySelectorAll("#nfb").forEach(b=>{b.onclick=nfOpen});if(document.querySelector("#nfb")){nfPaint();nfPoll()}}
/* ===== The bell (Notify.js): new plans, a returned report… The app asks every minute while open (a cheap call that answers
   «nothing new» from a cache) and when the rep comes back to it. Telegram linking stays inside the bell. ===== */
let NF=null,NF_AT=0;
const nfKey=()=>"mr_nf_"+((rep&&rep.id)||"");
function nfLoad(){if(NF)return NF;try{NF=JSON.parse(localStorage.getItem(nfKey())||"null")}catch(e){NF=null}return NF||(NF={ver:0,unread:0,items:[]})}
function nfBell(){return '<button type="button" class="tgb nfb" id="nfb" aria-label="الإشعارات" title="الإشعارات">🔔<i class="nfn" hidden></i></button>'}
function nfPaint(){const n=nfLoad().unread||0;document.querySelectorAll("#nfb .nfn").forEach(i=>{i.hidden=!n;i.textContent=n>9?"9+":n});document.querySelectorAll("#nfb").forEach(b=>b.setAttribute("aria-label",n?"الإشعارات: "+n+" جديدة":"الإشعارات"))}
function nfPoll(force){
 if(!rep||navigator.onLine===false)return;if(!force&&Date.now()-NF_AT<50000)return;NF_AT=Date.now();
 const before=nfLoad();
 srv("myNotifs",{since:before.ver||0}).then(r=>{if(!r||r.same)return;
  const old={};(before.items||[]).forEach(x=>old[x.id]=1);const fresh=(r.items||[]).filter(x=>!x.read&&!old[x.id]);
  NF={ver:r.ver,unread:r.unread,items:r.items};try{localStorage.setItem(nfKey(),JSON.stringify(NF))}catch(e){}nfPaint();
  if(!before.ver)return; // first load on this phone: no alert for old notifications
  const isRep=rep.role==="rep";if(isRep&&fresh.some(x=>x.type==="plan")&&typeof dpRefresh==="function")dpRefresh(true);
  const other=fresh.filter(x=>!isRep||x.type!=="plan");if(other.length)toast(other[0].text);
  if(fresh.length){try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
 }).catch(()=>{})}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")nfPoll()});
setInterval(()=>{if(document.visibilityState==="visible")nfPoll(true)},60000);
function nfAgo(at){const m=Math.floor((Date.now()-Date.parse(at))/60000);return m<1?"الآن":m<60?"قبل "+m+" دقيقة":m<1440?"قبل "+Math.floor(m/60)+" ساعة":new Date(at).toLocaleDateString("en-GB")}
/* A plan notification opened: «إلى / من» and every day with its doctors and appointments (rep), or the rep's change of an
   appointment «من … إلى …» (supervisor / admin); «فتح الخطة» goes to the plan. */
async function nfPlanDetail(x){
 const m=$("#modal"),close=()=>$("#ov").classList.remove("on"),r=x.ref||{};
 const openPlan=()=>{close();if(rep.role!=="rep"){if(r.repId)DPV.rep=r.repId;if(r.from)DPV.date=r.from<dpDate(0)?dpDate(0):r.from;navGo("dp")}else{dpRefresh(true);home()}};
 if(rep.role!=="rep"){m.innerHTML='<h3>'+esc(String(x.text).split("\n")[0])+'</h3><div class="nfdet">'+esc(String(x.text).split("\n").slice(1).join("\n"))+'</div><small class="nfago">'+esc(nfAgo(x.at))+'</small><button type="button" class="btn pri full" id="nf_go">فتح الخطة</button><button type="button" class="sheetbtn" id="nf_x">إغلاق</button>';
  $("#ov").classList.add("on");$("#nf_go").onclick=openPlan;$("#nf_x").onclick=close;return}
 m.innerHTML='<h3>'+esc(r.head||"خطة زيارات")+'</h3><div class="empty">جارٍ التحميل…</div>';$("#ov").classList.add("on");
 try{MYDP=await srv("myDayPlan");localStorage.setItem(dpKey(),JSON.stringify(MYDP))}catch(e){}
 const a=(dpLoad()||[]).filter(i=>(!r.from||i.date>=r.from)&&(!r.to||i.date<=r.to)),days=Array.from(new Set(a.map(i=>i.date))).sort();
 m.innerHTML='<h3>'+esc(r.head||"خطة زيارات")+'</h3><div class="nfto"><span>إلى: <b>'+esc(rep.name)+'</b></span><span>من: <b>'+esc(r.by||"المشرف")+'</b></span></div>'+
  (days.length?days.map(d=>'<div class="nfday">'+DPI.cal+esc(longDate(d))+'</div>'+a.filter(i=>i.date===d).map((i,n)=>{const w=[i.periodName,i.facilityName].filter(Boolean).join(" · ");
   return '<div class="nfdoc"><b>'+(n+1)+'. '+esc(i.doctorName)+(i.specialty?' ('+esc(i.specialty)+')':'')+'</b>'+(w?'<span class="ap">'+esc(w)+'</span>':'')+((i.purposeName||i.product)?'<span>'+esc(i.purposeName)+(i.product?': '+esc(i.product):'')+'</span>':'')+(i.note?'<span class="nt">ملاحظة: '+esc(i.note)+'</span>':'')+'</div>'}).join("")).join("")
   :'<div class="empty">'+esc(x.text)+'</div>')+
  '<button type="button" class="btn pri full" id="nf_go">فتح الخطة</button><button type="button" class="sheetbtn" id="nf_x">إغلاق</button>';
 $("#nf_go").onclick=openPlan;$("#nf_x").onclick=close;
}
async function nfOpen(){
 const nf=nfLoad(),m=$("#modal"),close=()=>$("#ov").classList.remove("on");
 m.innerHTML='<h3>🔔 الإشعارات</h3>'+(nf.items&&nf.items.length?'<div class="nflist">'+nf.items.map(x=>'<button type="button" class="nfi'+(x.read?"":" new")+'" data-id="'+esc(x.id)+'"><span class="nft '+esc(x.type)+(x.ref&&x.ref.change?" chg":"")+'">'+(x.type==="plan"?DPI.cal:x.type==="report"?DPI.note:DPI.goal)+'</span><span><b>'+esc(String(x.text).split("\n")[0])+'</b>'+(String(x.text).indexOf("\n")>0?'<span class="nfx">'+esc(String(x.text).split("\n").slice(1).join("\n"))+'</span>':'')+'<small>'+esc(nfAgo(x.at))+'</small></span></button>').join("")+'</div>'
  :'<div class="empty">'+(rep.role==="rep"?"لا توجد إشعارات بعد. هنا تصلك خطط الزيارات من المشرف، والتقارير المعادة للتصحيح.":"لا توجد إشعارات بعد. هنا يصلك تعديل المندوبين لمواعيد الخطط.")+'</div>')+
  (tgOn()?'<button type="button" class="sheetbtn" id="nf_tg">تنبيهات تيليجرام (تصل والتطبيق مغلق)</button>':'')+'<button type="button" class="sheetbtn" id="nf_x">إغلاق</button>';
 $("#ov").classList.add("on");$("#nf_x").onclick=close;if($("#nf_tg"))$("#nf_tg").onclick=tgOpen;
 m.querySelectorAll(".nfi").forEach(b=>b.onclick=()=>{const x=nf.items.find(i=>i.id===b.dataset.id);close();if(!x)return;
  if(x.type==="plan")return nfPlanDetail(x);else if(x.type==="report"&&typeof screenHistory==="function")screenHistory()});
 if(nf.unread){try{const r=await srv("notifsRead",{});NF={ver:r.ver,unread:r.unread,items:r.items};localStorage.setItem(nfKey(),JSON.stringify(NF))}catch(e){}nfPaint()}
}

let tgSeq=0;
async function tgOpen(){
 const seq=++tgSeq,m=$("#modal"),close=()=>$("#ov").classList.remove("on");
 m.innerHTML='<h3>🔔 تنبيهات تيليجرام</h3><div class="empty" id="tg_b">جارٍ التحميل…</div>';$("#ov").classList.add("on");
 const sup=rep&&rep.role!=="rep",what=sup?"ملخص يومي بالتقارير: من أرسل ومن لم يرسل، والزيارات، وما ينتظر الاعتماد.":"تذكير قبل موعد إرسال التقرير، وتنبيه فوري إذا أُعيد تقريرك للتصحيح.";
 const draw=async st=>{if(seq!==tgSeq||!m.isConnected)return;
  if(!st.enabled){m.innerHTML='<h3>🔔 تنبيهات تيليجرام</h3><div class="empty">التنبيهات غير مفعّلة لهذه الشركة.</div><button type="button" class="sheetbtn" id="tg_x">إغلاق</button>';$("#tg_x").onclick=close;return}
  if(st.linked){m.innerHTML='<h3>🔔 تنبيهات تيليجرام</h3><div class="tgok">✅ حسابك مربوط بتيليجرام</div><p class="tgtx">'+esc(what)+'</p><button type="button" class="sheetbtn danger" id="tg_un">إلغاء الربط</button><button type="button" class="sheetbtn" id="tg_x">إغلاق</button>';
   $("#tg_x").onclick=close;
   $("#tg_un").onclick=async()=>{const b=$("#tg_un");if(!b.dataset.c){b.dataset.c=1;b.textContent="اضغط مرة أخرى لتأكيد إلغاء الربط";return}b.disabled=true;try{draw(await srv("tgUnlink"));toast("تم إلغاء الربط")}catch(e){b.disabled=false;toast(e.message)}};return}
  let link;try{link=await srv("tgLinkStart")}catch(e){if(seq===tgSeq&&$("#tg_b"))$("#tg_b").textContent=e.message;return}
  if(seq!==tgSeq||!m.isConnected)return;
  m.innerHTML='<h3>🔔 تنبيهات تيليجرام</h3><p class="tgtx">'+esc(what)+'</p><ol class="tgsteps"><li>اضغط «فتح تيليجرام» ثم <b>Start</b> (أو «ابدأ»).</li><li>عُد إلى هنا واضغط «تحقق من الربط».</li></ol>'+
   '<a class="btn pri full" id="tg_go" target="_blank" rel="noopener">فتح تيليجرام</a><div class="err" id="tg_e"></div><button type="button" class="sheetbtn" id="tg_ck">تحقق من الربط</button><button type="button" class="sheetbtn" id="tg_x">إغلاق</button>';
  $("#tg_go").href=link.url;$("#tg_x").onclick=close;
  $("#tg_ck").onclick=async()=>{const b=$("#tg_ck");b.disabled=true;$("#tg_e").textContent="";
   try{const st2=await srv("tgLinkCheck");if(st2.linked){draw(st2);toast("تم الربط")}else{b.disabled=false;$("#tg_e").textContent="لم يصل تأكيد بعد. تأكد أنك ضغطت Start في تيليجرام ثم حاول مجددًا."}}
   catch(e){b.disabled=false;$("#tg_e").textContent=e.message}}};
 try{await draw(await srv("tgStatus"))}catch(e){if(seq===tgSeq&&$("#tg_b"))$("#tg_b").textContent=e.message}
}
function repNav(a){
 const items=[["t","اليوم"],["d","أطبائي"],["h","تقاريري"]];if(String((CFG.st||{}).repPerformanceEnabled)!=="false")items.push(["p","أدائي"]);
 return '<nav class="bnav" aria-label="التنقل">'+items.map(x=>'<button type="button" class="rn'+(x[0]===a?' on" aria-current="page':'')+'" data-n="'+x[0]+'">'+IC[x[0]]+x[1]+'</button>').join("")+'</nav>';
}
function bindNav(){tgBind();document.querySelectorAll(".rn").forEach(b=>b.onclick=()=>{const n=b.dataset.n;if(n==="t")home();else if(n==="h")screenHistory();else if(n==="d")screenPlan();else if(n==="p"&&String((CFG.st||{}).repPerformanceEnabled)!=="false")screenPerf();else home()});
 const l=$("#lo");if(l)l.onclick=async e=>{e.preventDefault();
  if(draftKeys().length&&!l.dataset.c){const h0=l.innerHTML;l.dataset.c=1;l.textContent="تعديلات لم تُحفظ بعد — اضغط مجددًا للخروج";saveBg().then(()=>{if(!draftKeys().length&&l.isConnected){l.dataset.c="";l.innerHTML=h0}});return}
  draftDropAll();cancelAuto();try{await srv("logout")}catch(x){}TOKEN=null;login()}}
async function screenHistory(){
 const seq=++repScreenSeq;
 $("#app").innerHTML=repTop("تقاريري")+'<div class="wrap rwrap"><div id="hl" class="empty">جارٍ التحميل…</div></div><div class="rdock">'+repNav("h")+'</div>';bindNav();
 try{const a=await srv("myReports"),h=$("#hl");if(seq!==repScreenSeq||!h)return;h.className="";
  h.innerHTML=a.length?a.map(r=>`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between;align-items:center"><b>${esc(r.date)}</b><span class="st ${SC[r.status]||"s0"}">${esc(r.status)}</span></div>
   <div style="color:var(--mut);font-size:13px">${esc(r.no||"")} · ${r.visits} زيارة${r.reopens?" · عُدّل بعد الإرسال":""}</div>
   ${r.reviewNote?`<div class="rnote2">ملاحظة الإدارة: ${esc(r.reviewNote)}</div>`:""}
   <div class="acts"><button class="mini" data-a="v" data-id="${esc(r.id)}">عرض</button>${r.status==="معاد للمندوب"||r.status==="مسودة"?`<button class="mini" data-a="e" data-d="${esc(r.date)}">متابعة الكتابة</button>`:""}</div></div>`).join(""):'<div class="empty">لا توجد تقارير بعد.</div>';
  document.querySelectorAll("#hl button.mini").forEach(b=>b.onclick=()=>b.dataset.a==="v"?viewMine(b.dataset.id):loadDay(b.dataset.d))}catch(e){if(seq===repScreenSeq)toast(e.message)}}
async function viewMine(id){
 const seq=repScreenSeq;
 try{const r=await srv("getReport",{id});if(seq!==repScreenSeq)return;const x=r.snapshot||{company:{},no:r.no,rep:rep.name,date:r.date,notes:r.notes,doctors:r.doctors,pharmacies:r.pharmacies};
  $("#stage").innerHTML=render({company:coOf(x.company||{}),no:x.no,rep:x.rep,day:DAYS[new Date(x.date+"T12:00:00").getDay()],date:x.date.split("-").reverse().join(" / "),notes:x.notes,docs:x.doctors,phs:x.pharmacies});
  ["#pvsend","#pvok","#pvret","#pv1","#pvs"].forEach(i=>{$(i).style.display="none"});$("#pv").classList.add("on");fit()}catch(e){toast(e.message)}}
async function screenPerf(ym){
 const seq=++repScreenSeq;
 const n=new Date(),op=[];for(let i=0;i<6;i++){const d=new Date(n.getFullYear(),n.getMonth()-i,1);op.push(d.getFullYear()+"-"+pad(d.getMonth()+1))}
 ym=ym||op[0];
 $("#app").innerHTML=repTop("أدائي")+`<div class="rdock">${repNav("p")}</div><div class="wrap rwrap"><label>الشهر</label><select id="pm">${op.map(o=>`<option value="${o}" ${o===ym?"selected":""}>${MN[+o.slice(5)-1]} ${o.slice(0,4)}</option>`).join("")}</select><div id="pb2" style="margin-top:14px"><div class="empty">جارٍ الحساب…</div></div></div>`;
 bindNav();$("#pm").onchange=()=>screenPerf($("#pm").value);
 try{const r=await srv("myPerformance",{ym}),pb=$("#pb2");if(seq!==repScreenSeq||!pb)return;
  pb.innerHTML=`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between;align-items:center"><b>الدرجة النهائية</b><span class="sc">${r.score}%</span></div><div class="pb"><i style="width:${Math.min(100,r.score)}%"></i></div>
  <div style="color:var(--mut);font-size:14px">الالتزام: ${r.onTime} من ${r.expected} في الوقت (${r.compliance}%) · الزيارات: ${r.visits}</div></div>
  <div style="overflow-x:auto"><table class="kt"><tr><th>المؤشر</th><th>الهدف</th><th>الفعلي</th><th>%</th><th>الوزن</th><th>الدرجة</th></tr>${r.kpis.map(k=>`<tr><td>${esc(k.name)}</td><td>${k.target}</td><td>${k.actual}</td><td>${k.achievement}</td><td>${k.weight}</td><td>${k.weighted}</td></tr>`).join("")}</table></div>
  <div class="empty" style="margin-top:8px">الأهداف شهرية. الدرجة تُحسب من التقارير المرسلة، والشهر الحالي يتحدّث تلقائيًا.</div>`}catch(e){const pb=$("#pb2");if(seq===repScreenSeq&&pb)pb.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}

/* ===== Admin settings: company / KPI / products ===== */
let SS="co",settingsViewSeq=0;
function tabSet(){
 const view=++settingsViewSeq;
 $("#av").innerHTML=`<div class="tabs" style="margin:0 0 12px"><button class="btn" data-s="co">الشركة والنظام</button><button class="btn" data-s="kpi">المؤشرات</button><button class="btn" data-s="prod">المنتجات</button><button class="btn" data-s="hol">العطل</button><button class="btn" data-s="sup">المشرفون</button></div><div id="sv2"></div>`;
 document.querySelectorAll("[data-s]").forEach(b=>{b.classList.toggle("on",b.dataset.s===SS);b.onclick=()=>{SS=b.dataset.s;tabSet()}});
 ({co:tabCo,kpi:()=>tabKpi(view),prod:()=>tabProd(view),hol:()=>tabHol(view),sup:()=>tabSup(view)})[SS]();
}
function tabCo(){
 const view=settingsViewSeq,live=()=>view===settingsViewSeq&&!!$("#sv2");
 const st=CFG.st||{},logoInitial=String(st.logo||""),v=k=>esc(st[k]===undefined?"":st[k]),re=String(st.remindEnabled)==="true",repPerfEnabled=String(st.repPerformanceEnabled)!=="false";
 $("#sv2").innerHTML=`<label>اسم الشركة</label><input id="c_n" value="${v("companyName")}">
 <div class="two"><div><label>اختصار الشعار</label><input id="c_s" maxlength="3" value="${v("shortName")}"></div><div><label>لون الهوية</label><input id="c_c" type="color" style="padding:4px" value="${esc(st.brandColor||"#0b6b6f")}"></div></div>
 <label>مظهر الألوان</label><select id="c_theme">${[["auto","حسب إعداد الجهاز (فاتح أو داكن)"],["light","فاتح دائمًا"],["dark","داكن دائمًا"]].map(o=>`<option value="${o[0]}" ${(["light","dark"].indexOf(st.theme)>=0?st.theme:"auto")===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select><div class="empty" style="margin:6px 0 4px">يُطبَّق على جميع المستخدمين: المندوبين والإدارة.</div>
 <label>مفتاح خرائط القمر الصناعي (اختياري)</label><input id="c_mapkey" dir="ltr" autocomplete="off" spellcheck="false" placeholder="اتركه فارغًا لاستخدام الخدمة المجانية" value="${v("mapKey")}"><div class="empty" style="margin:6px 0 4px">مفتاح Esri بصلاحية Basemaps. يُستخدم في خرائط الإدارة فقط، ولا يُرسل إلى المندوبين.</div>
 <label>عنوان التقرير</label><input id="c_t" value="${v("reportTitle")}"><label>هاتف الشركة</label><input id="c_p" value="${v("phone")}"><label>عنوان الشركة</label><input id="c_a" value="${v("address")}">

 <div class="two"><div><label>تذكير الصباح (0–23)</label><input id="c_h" type="number" min="0" max="23" value="${esc(st.remindHour||8)}"></div><div><label>تذكير المساء (0–23)</label><input id="c_h2" type="number" min="0" max="23" value="${esc(st.remindEvening||18)}"></div></div><div class="empty" style="margin:8px 0">صباحًا: بتقرير الأمس غير المرسل. مساءً: بتقرير اليوم. وتنبيه ثالث تلقائي قبل ساعة من ساعة الإغلاق لمن لم يرسل بعد. لا تصل التنبيهات لمن في إجازة أو عطلة.</div><div class="err" id="c_err"></div><button class="btn pri full" id="c_go" style="margin-top:14px">حفظ</button>`;
 const saveLogo=async u=>{try{const saved=await srv("saveLogo",{url:u});if(!live()||!$("#c_img")||!$("#c_err"))return;const finalUrl=typeof saved==="string"?saved:u;CFG.company.logo=finalUrl;CFG.st.logo=finalUrl;$("#c_logo_url").value=finalUrl;$("#c_img").src=finalUrl;$("#c_img").style.display=finalUrl?"block":"none";$("#c_err").style.color="";$("#c_err").textContent=finalUrl?"✓ تم حفظ رابط الشعار":"✓ تمت إزالة الشعار"}catch(e){if(live()&&$("#c_err"))$("#c_err").textContent="تعذّر حفظ رابط الشعار: "+e.message}};
 $("#c_logo_url").oninput=()=>{const u=$("#c_logo_url").value.trim();if(u){$("#c_img").src=u;$("#c_img").style.display="block"}else $("#c_img").style.display="none"};
 $("#c_logo_save").onclick=()=>saveLogo($("#c_logo_url").value.trim());
 $("#c_rm").onclick=()=>{ $("#c_logo_url").value=""; saveLogo("") };
 $("#c_go").onclick=async()=>{const vals={companyName:$("#c_n").value,shortName:$("#c_s").value,brandColor:$("#c_c").value,reportTitle:$("#c_t").value,phone:$("#c_p").value,address:$("#c_a").value,reportEmail:$("#c_e").value,closeHour:$("#c_ch").value,workDays:$("#c_w").value.replace(/\s/g,""),gpsRadius:$("#c_g").value,gpsRefAcc:$("#c_ga").value,repPerformanceEnabled:$("#c_rep_perf").checked?"true":"false",workplacePolicy:$("#c_wpol").value,theme:$("#c_theme").value,mapKey:$("#c_mapkey").value.trim()};
  if(+vals.gpsRadius<20||+vals.gpsRefAcc<1||+vals.gpsRefAcc>500)throw new Error("تحقق من نطاق الموقع ودقة GPS (1–500 متر).");const b=$("#c_go");b.disabled=true;$("#c_err").textContent="";
  try{await srv("saveSettings",{values:vals});if(!live())return;let rm="";const reminders={enabled:$("#c_r").checked,hour:$("#c_h").value,evening:$("#c_h2").value};
   try{await srv("setReminders",reminders)}catch(e){rm="حُفظت الإعدادات لكن تعذّر ضبط التذكيرات: "+e.message}
   if(!live())return;Object.assign(CFG.st,vals,{remindEnabled:reminders.enabled,remindHour:reminders.hour,remindEvening:reminders.evening});Object.assign(CFG.company,{name:vals.companyName,short:vals.shortName,color:vals.brandColor,title:vals.reportTitle,phone:vals.phone,address:vals.address});
   document.documentElement.style.setProperty("--brand",vals.brandColor);applyTheme(vals.theme);if(rm&&$("#c_err"))$("#c_err").textContent=rm;else if(!rm)toast("تم الحفظ")}catch(e){if(live()&&$("#c_err"))$("#c_err").textContent=e.message}finally{b.disabled=false}};
}
async function tabKpi(view=settingsViewSeq){
 const host=()=>view===settingsViewSeq?$("#sv2"):null;const target=host();if(!target)return;
 target.innerHTML='<div class="empty">جارٍ التحميل…</div>';
 try{const a=await srv("kpiList");
  const target=host();if(!target)return;
  target.innerHTML=a.map(k=>`<div class="row kr" style="display:block" data-k="${esc(k.key)}"><b>${esc(k.name)}</b><div class="two"><div><label>${k.key==="compliance"?"الهدف (يُحسب تلقائيًا)":"الهدف للشهر"}</label><input class="kt_t" type="number" min="0" value="${esc(k.target)}" ${k.key==="compliance"?"disabled":""}></div><div><label>الوزن</label><input class="kt_w" type="number" min="0" value="${esc(k.weight)}"></div></div>
   <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input class="kt_a" type="checkbox" style="width:auto;min-height:0" ${String(k.active)!=="false"?"checked":""}> مفعّل</label></div>`).join("")+'<div id="kw" class="empty"></div><div class="err" id="k_err"></div><button class="btn pri full" id="kgo">حفظ المؤشرات</button><div class="empty" style="margin-top:8px">بعد التعديل أعد حساب الأشهر المغلقة من تبويب المقارنة إن أردت أن تتأثر بالقيم الجديدة.</div>';
  const sum=()=>{let t=0;document.querySelectorAll(".kr").forEach(r=>{if(r.querySelector(".kt_a").checked)t+=+r.querySelector(".kt_w").value||0});$("#kw").textContent="مجموع أوزان المؤشرات المفعّلة: "+t+" (تُحتسب النسب منه تلقائيًا)"};
  document.querySelectorAll(".kr input").forEach(i=>i.oninput=sum);sum();
  $("#kgo").onclick=async()=>{try{await srv("saveKpi",{rows:[...document.querySelectorAll(".kr")].map(r=>({key:r.dataset.k,target:+r.querySelector(".kt_t").value||0,weight:+r.querySelector(".kt_w").value||0,active:r.querySelector(".kt_a").checked}))});if(host())toast("تم الحفظ")}catch(e){const err=host()&&$("#k_err");if(err)err.textContent=e.message}}}catch(e){if(host())toast(e.message)}}
let PL=[];
async function tabProd(view=settingsViewSeq){const host=()=>view===settingsViewSeq?$("#sv2"):null;const target=host();if(!target)return;target.innerHTML='<div class="empty">جارٍ التحميل…</div>';try{const rows=await srv("list",{entity:"Products"});if(!host())return;PL=rows;drawProd()}catch(e){if(host())toast(e.message)}}
function drawProd(){if(!$("#sv2"))return;const off=p=>p.status==="متوقف";
 $("#sv2").innerHTML='<div class="two"><button class="btn dash" id="padd">＋ إضافة منتج</button><button class="btn dash" id="pimp">استيراد منتجات من Excel</button></div><div style="height:10px"></div>'+(PL.map(p=>`<div class="row" style="display:block;${off(p)?"opacity:.65":""}" data-id="${esc(p.id)}"><b>${esc(p.name)}</b> <span class="st ${off(p)?"s4":"s3"}">${off(p)?"متوقف":"نشط"}</span><div style="color:var(--mut);font-size:13px">${esc(p.category||"بدون تصنيف")}</div><div class="acts"><button class="mini" data-a="e">تعديل</button><button class="mini" data-a="t">${off(p)?"تفعيل":"إيقاف"}</button></div></div>`).join("")||'<div class="empty">لا توجد منتجات.</div>');
 $("#padd").onclick=()=>pForm();$("#pimp").onclick=()=>openImport("Products");
 document.querySelectorAll("#sv2 button.mini").forEach(b=>b.onclick=()=>{const p=PL.find(x=>x.id===b.closest(".row").dataset.id);if(b.dataset.a==="e")pForm(p);else pSave({id:p.id,status:off(p)?"نشط":"متوقف"})})}
function pForm(p){$("#modal").innerHTML=`<h3>${p?"تعديل منتج":"إضافة منتج"}</h3><label>اسم المنتج *</label><input id="p_n" value="${esc(p?p.name:"")}"><label>التصنيف</label><input id="p_c" value="${esc(p?p.category:"")}"><div class="err" id="ferr"></div><div class="two" style="margin-top:14px"><button class="btn" id="cx">إلغاء</button><button class="btn pri" id="sv">حفظ</button></div>`;
 $("#ov").classList.add("on");$("#cx").onclick=()=>$("#ov").classList.remove("on");$("#sv").onclick=()=>pSave({id:p?p.id:undefined,name:$("#p_n").value,category:$("#p_c").value})}
async function pSave(row){try{await srv("save",{entity:"Products",row:JSON.parse(JSON.stringify(row))});$("#ov").classList.remove("on");toast("تم");tabProd()}catch(e){const f=$("#ferr");f?f.textContent=e.message:toast(e.message)}}
/* ===== Leaves / permissions per rep, and official holidays ===== */
async function lForm(r){
 const draw=async()=>{let a=[];try{a=await srv("leavesList",{repId:r.id})}catch(e){toast(e.message)}const td=isoD(new Date());
  $("#modal").innerHTML=`<h3>إجازات وأذونات — ${esc(r.name)}</h3>${a.length?a.map(l=>`<div class="row" style="display:block"><b>${esc(l.type)}</b> · ${esc(l.from)}${l.to!==l.from?" ← "+esc(l.to):""}${l.note?`<div style="color:var(--mut);font-size:13px">${esc(l.note)}</div>`:""}<div class="acts"><button class="mini" data-id="${esc(l.id)}">حذف</button></div></div>`).join(""):'<div class="empty">لا توجد إجازات مسجّلة.</div>'}
  <div class="sec"><h3>تسجيل جديد</h3></div><label>النوع</label><select id="l_t">${["سنوية","مرضية","مهمة رسمية","إذن"].map(x=>`<option>${x}</option>`).join("")}</select>
  <div class="two"><div><label>من</label><input type="date" id="l_f" value="${td}"></div><div><label>إلى</label><input type="date" id="l_e" value="${td}"></div></div><label>ملاحظة</label><input id="l_n">
  <div class="empty" style="margin-top:8px">«إذن» يخفّض أهداف اليوم بنصف يوم ويبقى تقرير ذلك اليوم مطلوبًا. بقية الأنواع تعفي اليوم كاملًا. لإعادة حساب شهر مغلق استخدم تبويب المقارنة.</div>
  <div class="err" id="ferr"></div><div class="two" style="margin-top:14px"><button class="btn" id="cx">إغلاق</button><button class="btn pri" id="sv">إضافة</button></div>`;
  $("#cx").onclick=()=>$("#ov").classList.remove("on");
  document.querySelectorAll("#modal button.mini").forEach(b=>b.onclick=async()=>{if(!b.dataset.c){b.dataset.c=1;b.textContent="تأكيد الحذف؟";return}try{await srv("leaveDelete",{id:b.dataset.id});draw()}catch(e){toast(e.message)}});
  $("#sv").onclick=async()=>{try{await srv("leaveSave",{row:{repId:r.id,type:$("#l_t").value,from:$("#l_f").value,to:$("#l_e").value,note:$("#l_n").value}});toast("تم التسجيل");draw()}catch(e){$("#ferr").textContent=e.message}}};
 $("#ov").classList.add("on");await draw();
}

 const host=()=>view===settingsViewSeq?$("#sv2"):null;const target=host();if(!target)return;

/* Supervisors: review-only accounts (reports, approve / return, visit locations). Edit = same form, password optional. */
async function tabSup(view=settingsViewSeq){
 const host=()=>view===settingsViewSeq?$("#sv2"):null;if(!host())return;host().innerHTML='<div class="empty">جارٍ التحميل…</div>';
 try{const a=await srv("supervisorsList");if(!host())return;let edit=null;
  const draw=()=>{const t=host();if(!t)return;
   t.innerHTML='<div class="empty">المشرف يرى تقارير كل المندوبين، ويعتمدها أو يعيدها، ويرى مواقع الزيارات. لا يرى الإعدادات ولا الأداء ولا التصدير، ويدخل من «دخول الإدارة» باسم المستخدم وكلمة المرور.</div>'
    +a.map(x=>`<div class="row"><div class="t"><b>${esc(x.name)}</b><small dir="ltr" style="text-align:right">${esc(x.username)}${x.active?"":" · معطّل"}</small></div><div class="acts"><button class="mini" type="button" data-e="${esc(x.id)}">تعديل</button></div></div>`).join("")
    +`<div class="sec"><h3>${edit?"تعديل المشرف":"إضافة مشرف"}</h3></div><label>الاسم</label><input id="u_n" value="${esc(edit?edit.name:"")}"><label>اسم المستخدم</label><input id="u_u" dir="ltr" autocomplete="off" spellcheck="false" value="${esc(edit?edit.username:"")}">`
    +`<label>${edit?"كلمة مرور جديدة (اتركها فارغة للإبقاء على الحالية)":"كلمة المرور (10 أحرف على الأقل)"}</label><input id="u_p" type="password" dir="ltr" autocomplete="new-password">`
    +(edit?`<label class="ap-check"><input type="checkbox" id="u_a" ${edit.active?"checked":""}> الحساب مفعّل</label>`:"")
    +`<div class="err" id="u_err"></div><button class="btn pri full" id="u_go" style="margin-top:14px">${edit?"حفظ التعديل":"إضافة المشرف"}</button>${edit?'<button class="btn full" id="u_cx" style="margin-top:8px">إلغاء</button>':""}`;
   t.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{edit=a.find(x=>x.id===b.dataset.e);draw()});
   if($("#u_cx"))$("#u_cx").onclick=()=>{edit=null;draw()};
   $("#u_go").onclick=async()=>{const b=$("#u_go");b.disabled=true;
    try{const out=await srv("supervisorSave",{id:edit?edit.id:"",name:$("#u_n").value,username:$("#u_u").value,password:$("#u_p").value,active:edit?$("#u_a").checked:true});
     if(!host())return;toast(edit?"تم حفظ التعديل":"تمت إضافة المشرف "+out.username);tabSup(view)}
    catch(e){const err=host()&&$("#u_err");if(err)err.textContent=e.message;b.disabled=false}}};
  draw()}catch(e){if(host())toast(e.message)}}

const DASH_GPS_COLORS={"تم التحقق":"#16a34a","خارج النطاق":"#dc2626","غير حاسم":"#f59e0b","مرجع غير مؤكد":"#7c3aed","غير متاح":"#94a3b8"};
function dashChange(c,unit){
 if(c==null)return '<span class="dc">لا توجد بيانات سابقة للمقارنة</span>';
 if(c===0)return '<span class="dc">بدون تغيير عن الفترة السابقة</span>';
 return '<span class="dc">'+(c>0?"▲ +":"▼ ")+c+(unit||"%")+' عن الفترة السابقة</span>';
}
function dashLine(daily){
 const n=daily.length;if(!n)return '<div class="empty">لا توجد بيانات.</div>';
 const W=640,H=220,L=36,R=12,TP=14,B=28,max=Math.max(1,...daily.map(x=>Math.max(x.doctors,x.pharmacies)));
 const step=Math.pow(10,Math.floor(Math.log10(max))),top=Math.max(step,Math.ceil(max/step)*step);
 const x=i=>L+(n===1?(W-L-R)/2:i*(W-L-R)/(n-1)),y=v=>H-B-v/top*(H-TP-B),f=v=>v.toFixed(1);
 const pts=k=>daily.map((d,i)=>f(x(i))+","+f(y(d[k]))).join(" ");
 const grid=[0,.25,.5,.75,1].map(t=>{const yy=f(y(top*t));return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" class="g"/><text x="'+(L-6)+'" y="'+yy+'" class="ax" text-anchor="end" dominant-baseline="middle">'+Math.round(top*t)+'</text>'}).join("");
 const every=Math.max(1,Math.ceil(n/7)),labels=daily.map((d,i)=>(i%every&&i!==n-1)?"":'<text x="'+f(x(i))+'" y="'+(H-8)+'" class="ax" text-anchor="middle">'+d.date.slice(8)+"/"+d.date.slice(5,7)+'</text>').join("");
 const dots=k=>n>31?"":daily.map((d,i)=>'<circle cx="'+f(x(i))+'" cy="'+f(y(d[k]))+'" r="3" class="'+k+'"><title>'+d.date+" : "+d[k]+'</title></circle>').join("");
 return '<svg viewBox="0 0 '+W+' '+H+'" class="dl" role="img" aria-label="حركة الزيارات اليومية">'+grid+
  '<polygon class="ar" points="'+f(x(0))+","+(H-B)+" "+pts("doctors")+" "+f(x(n-1))+","+(H-B)+'"/>'+
  '<polyline class="ln doctors" points="'+pts("doctors")+'"/><polyline class="ln pharmacies" points="'+pts("pharmacies")+'"/>'+dots("doctors")+dots("pharmacies")+labels+'</svg>';
}
function dashDonut(gps){
 const total=gps.reduce((a,x)=>a+x.count,0),R=60,C=2*Math.PI*R;let off=0;
 const rings=total?gps.filter(x=>x.count).map(x=>{const len=x.count/total*C,s='<circle r="'+R+'" cx="80" cy="80" fill="none" stroke="'+DASH_GPS_COLORS[x.status]+'" stroke-width="22" stroke-dasharray="'+len.toFixed(2)+" "+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 80 80)"><title>'+esc(x.status)+" : "+x.count+'</title></circle>';off+=len;return s}).join("")
  :'<circle r="'+R+'" cx="80" cy="80" fill="none" stroke="var(--line)" stroke-width="22"/>';
 return '<div class="dd"><svg viewBox="0 0 160 160" class="dn" role="img" aria-label="نتائج التحقق من الموقع">'+rings+'<text x="80" y="78" text-anchor="middle" class="dt">'+total+'</text><text x="80" y="100" text-anchor="middle" class="ds">زيارة</text></svg>'+
  '<div class="lg">'+gps.map(x=>'<div><i style="background:'+DASH_GPS_COLORS[x.status]+'"></i>'+esc(x.status)+'<b>'+x.count+'</b><span>'+(total?Math.round(x.count/total*100):0)+'%</span></div>').join("")+'</div></div>';
}
function dashCompliance(rows){
 if(!rows.length)return '<div class="empty">لا يوجد مندوبون نشطون.</div>';
 return rows.map(r=>{const c=r.pct>=85?"#16a34a":r.pct>=60?"#f59e0b":"#dc2626";
  return '<div class="cr"><div class="cn"><b>'+esc(r.name)+'</b><span>'+(r.expected?r.pct+"%":"—")+'</span></div><div class="cb"><i style="width:'+(r.expected?Math.max(2,Math.min(100,r.pct)):0)+'%;background:'+c+'"></i></div>'+
   '<small>في الوقت '+r.onTime+' من '+r.expected+' · متأخر '+r.late+' · غير مرسل '+r.missing+'</small></div>'}).join("");
}

   d.latest.map(r=>'<tr class="dr" data-id="'+esc(r.id)+'"><td>'+esc(r.no)+'</td><td>'+esc(r.repName)+'</td><td>'+esc(r.date)+'</td><td>'+r.visits+'</td><td><span class="st s'+stat.indexOf(r.status)+'">'+esc(r.status)+'</span></td></tr>').join("")+'</table></div>':'<div class="empty">لا توجد تقارير مرسلة بعد.</div>')+'</div></div>'+

/* Doctor avatar in «أطبائي»: the first letters of the name (without «د.») in the colour of the doctor's class, with the class
   letter in the corner; a doctor without an approved class shows the doctor figure. */
function docInitials(n){
 const w=String(n||"").replace(/^\s*(د\s*\.?|dr\.?)\s*/i,"").trim().split(/\s+/).filter(Boolean).map(x=>x.replace(/^ال(?=..)/,""));
 // two separate letters (U+200C stops Arabic letters from joining into a word)
 return (w.length>1?w[0][0]+"‌"+w[w.length-1][0]:(w[0]||"؟")[0]).toUpperCase()
}
function docAvatar(name,cls){
 return cls?'<span class="dav c'+cls+'" aria-hidden="true">'+esc(docInitials(name))+'<i>'+cls+'</i></span>':'<span class="dav dfig" aria-hidden="true">'+DOC_FIG+'</span>'
}
/* ===== Doctor work schedules (Schedule.js): facility + day + period, several places a day; «غير متواجد اليوم» for one day.
   Shared by every rep, supervisor and admin; it only helps (visit form, «أطبائي», daily plans) and never blocks. ===== */
const SCH_P={am:"صباحًا",pm:"مساءً",all:"يوم كامل"},SCH_D=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"],SCH_ORDER=[6,0,1,2,3,4,5];
let SCHED=null,SCHED_AT=0;
try{SCHED=JSON.parse(localStorage.getItem("mr_sched")||"null")}catch(e){SCHED=null}
function schSet(r){SCHED=r||{sched:{},absent:{}};SCHED_AT=Date.now();try{localStorage.setItem("mr_sched",JSON.stringify(SCHED))}catch(e){}return SCHED}
async function schLoad(force){
 if(!force&&SCHED&&Date.now()-SCHED_AT<300000)return SCHED;
 try{return schSet(await srv("docSchedules"))}catch(e){return SCHED||{sched:{},absent:{}}}
}
function schDate(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
// null = no schedule; else {off, absent, slots:[{f,n,d,p}]} for that date (default today).
function schOn(docId,date){
 const o=SCHED&&SCHED.sched&&SCHED.sched[docId];if(!o)return null;date=date||schDate();
 const wd=new Date(date+"T12:00:00").getDay(),slots=o.slots.filter(x=>x.d===wd),absent=((SCHED.absent||{})[docId]||[]).indexOf(date)>=0;
 return {off:absent||!slots.length,absent,slots};
}
function schTodayHtml(docId){
 const t=schOn(docId);if(!t)return "";
 return '<div class="schtoday'+(t.off?" off":"")+'">'+IC.clock+' '+(t.absent?"غير متواجد اليوم":t.off?"لا يعمل اليوم حسب جدوله":"اليوم: "+t.slots.map(x=>esc(x.n)+" "+SCH_P[x.p]).join(" · "))+'</div>';
}
// For the visit form: the facility where the doctor works now (by the time of day), or null.
function schPickNow(docId){
 const t=schOn(docId);if(!t||t.off)return null;const pm=new Date().getHours()>=14;
 return (t.slots.find(x=>x.p===(pm?"pm":"am"))||t.slots.find(x=>x.p==="all")||t.slots[0]);
}
function schAgo(at){if(!at)return "";const d=Math.floor((Date.now()-Date.parse(at))/864e5);return d<=0?"اليوم":d===1?"أمس":"قبل "+d+" أيام"}
// Editor: groups of (facility, period) with their days; add / edit / delete; save sends the whole schedule.
async function schEdit(docId,name,done){
 await schLoad();
 const o=(SCHED.sched||{})[docId],doc=(CFG.docs||[]).find(d=>String(d.id)===String(docId))||{};
 let slots=o?o.slots.map(x=>({f:x.f,n:x.n,d:x.d,p:x.p})):[];
 const own=(doc.workplaces||[]).filter(w=>String(w.active)!=="false"),ownIds=new Set(own.map(w=>String(w.id)));
 const others=(CFG.facilities||[]).filter(w=>String(w.active)!=="false"&&!ownIds.has(String(w.id)));
 const opt=w=>'<option value="'+esc(w.id)+'">'+esc(w.workplace)+'</option>';
 $("#modal").innerHTML='<h3>أيام عمل '+esc(name)+'</h3><p class="tgtx">أين يعمل الطبيب في كل يوم. يمكن إضافة أكثر من مكان في نفس اليوم (صباحًا في مكان ومساءً في آخر)، والتعديل في أي وقت.</p>'+
  '<div id="se_l"></div><div class="sedit"><b id="se_t">إضافة فترة عمل</b><label>المنشأة</label><select id="se_f"><option value="">— اختر المنشأة —</option>'+
  (own.length?'<optgroup label="منشآت الطبيب">'+own.map(opt).join("")+'</optgroup>':'')+(others.length?'<optgroup label="منشآت أخرى">'+others.map(opt).join("")+'</optgroup>':'')+'</select>'+
  '<label>الأيام</label><div class="sedays">'+SCH_ORDER.map(d=>'<button type="button" class="sday" data-d="'+d+'" aria-pressed="false">'+SCH_D[d]+'</button>').join("")+'</div>'+
  '<label>الفترة</label><div class="seper">'+Object.keys(SCH_P).map(p=>'<button type="button" class="sper'+(p==="am"?" on":"")+'" data-p="'+p+'">'+SCH_P[p]+'</button>').join("")+'</div>'+
  '<button type="button" class="btn dash" id="se_add">'+IC.plus+' إضافة للجدول</button></div><div class="err" id="se_e"></div>'+
  (o&&o.at?'<div class="setime">آخر تحديث: '+esc(o.by||"")+' · '+esc(schAgo(o.at))+'</div>':'')+
  '<div class="mfoot"><button class="btn" id="se_x">إلغاء</button><button class="btn pri" id="se_s">حفظ الجدول</button></div>';
 $("#ov").classList.add("on");$("#se_x").onclick=()=>$("#ov").classList.remove("on");
 let per="am";
 document.querySelectorAll(".sday").forEach(b=>b.onclick=()=>{const on=b.classList.toggle("on");b.setAttribute("aria-pressed",on)});
 document.querySelectorAll(".sper").forEach(b=>b.onclick=()=>{per=b.dataset.p;document.querySelectorAll(".sper").forEach(x=>x.classList.toggle("on",x===b))});
 const draw=()=>{
  const g={};slots.forEach(x=>{const k=x.f+"|"+x.p;(g[k]=g[k]||{f:x.f,n:x.n,p:x.p,days:[]}).days.push(x.d)});
  const list=Object.keys(g).map(k=>g[k]);
  $("#se_l").innerHTML=list.length?list.map((x,i)=>'<div class="segrp" data-i="'+i+'"><div><b>'+esc(x.n)+'</b> · '+SCH_P[x.p]+'<div class="sedl">'+SCH_ORDER.filter(d=>x.days.indexOf(d)>=0).map(d=>SCH_D[d]).join("، ")+'</div></div><div class="acts"><button type="button" class="mini" data-a="ed">تعديل</button><button type="button" class="mini" data-a="del">حذف</button></div></div>').join("")
   :'<div class="empty">لا يوجد جدول بعد. أضف أول فترة عمل بالأسفل.</div>';
  $("#se_l").querySelectorAll(".segrp .mini").forEach(b=>b.onclick=()=>{const x=list[+b.closest(".segrp").dataset.i];slots=slots.filter(s=>!(s.f===x.f&&s.p===x.p));
   if(b.dataset.a==="ed"){$("#se_f").value=x.f;per=x.p;document.querySelectorAll(".sper").forEach(e=>e.classList.toggle("on",e.dataset.p===x.p));
    document.querySelectorAll(".sday").forEach(e=>{const on=x.days.indexOf(+e.dataset.d)>=0;e.classList.toggle("on",on);e.setAttribute("aria-pressed",on)});$("#se_t").textContent="تعديل: "+x.n+" · "+SCH_P[x.p];$("#se_f").scrollIntoView({block:"center"})}
   draw()});
 };
 $("#se_add").onclick=()=>{$("#se_e").textContent="";const f=$("#se_f").value,days=[].map.call(document.querySelectorAll(".sday.on"),b=>+b.dataset.d);
  if(!f)return $("#se_e").textContent="اختر المنشأة.";if(!days.length)return $("#se_e").textContent="اختر يومًا واحدًا على الأقل.";
  const n=($("#se_f").selectedOptions[0]||{}).textContent||"";
  days.forEach(d=>{if(!slots.some(s=>s.f===f&&s.d===d&&s.p===per))slots.push({f,n,d,p:per})});
  document.querySelectorAll(".sday").forEach(e=>{e.classList.remove("on");e.setAttribute("aria-pressed",false)});$("#se_f").value="";$("#se_t").textContent="إضافة فترة عمل";draw()};
 $("#se_s").onclick=async()=>{const b=$("#se_s");b.disabled=true;$("#se_e").textContent="";
  if([].some.call(document.querySelectorAll(".sday"),x=>x.classList.contains("on"))&&$("#se_f").value){b.disabled=false;return $("#se_e").textContent="اضغط «إضافة للجدول» أولًا لإضافة الأيام المختارة، أو ألغِ اختيارها."}
  try{schSet(await srv("docScheduleSave",{doctorId:docId,slots:slots.map(x=>({facilityId:x.f,day:x.d,period:x.p}))}));$("#ov").classList.remove("on");toast("حُفظ جدول الطبيب");if(done)done()}
  catch(e){b.disabled=false;$("#se_e").textContent=e.message}};
 draw();
}
async function schAbsentToggle(docId,on,done){
 try{schSet(await srv("docAbsent",{doctorId:docId,undo:!on}));toast(on?"سُجّل: غير متواجد اليوم":"أُلغي «غير متواجد اليوم»");if(done)done()}catch(e){toast(e.message)}
}
</script>
