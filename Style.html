<style>
:root{--brand:#0b6b6f;--bg:#f3f6f6;--card:#fff;--ink:#14282a;--mut:#5d7274;--line:#d9e3e3;--danger:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1b;--card:#172526;--ink:#e6f0f0;--mut:#9ab1b2;--line:#294042}}
:root[data-theme="dark"]{--bg:#0f1a1b;--card:#172526;--ink:#e6f0f0;--mut:#9ab1b2;--line:#294042}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 Tajawal,Tahoma,Arial,sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.full{width:100%}
.btn.dash{width:100%;border-style:dashed;color:var(--brand)}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .box{width:100%;max-width:340px}
.login h1{margin:0 0 4px;font-size:30px;color:var(--brand);font-weight:800}
.login input{text-align:center;letter-spacing:.5em;font-size:24px;margin:14px 0}
.err{color:var(--danger);font-size:14px;min-height:20px}
.top{background:var(--brand);color:#fff;padding:14px 16px 16px}
.top .co{opacity:.85;font-size:14px}.top h2{margin:2px 0 6px;font-size:20px}
.top .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;opacity:.92}
.sec{margin:20px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec h3{margin:0;font-size:17px}.sec span{color:var(--mut);font-size:14px}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row .n{font-weight:800;color:var(--brand);min-width:26px}
.row .t{flex:1;min-width:0}.row .t b{display:block}.row .t small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row button{min-width:44px;min-height:44px;border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer}
.row button.del{color:var(--danger)}
.empty{color:var(--mut);font-size:14px;padding:6px 2px}
.bar{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bar .btn{flex:1}
.toast{position:fixed;top:12px;z-index:99;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#14282a;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.modal{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.modal h3{margin:0}
.seg{display:flex;gap:8px}.seg label{flex:1;margin:0;color:var(--ink)}
.seg input{display:none}.seg span{display:block;text-align:center;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.seg input:checked+span{background:var(--brand);color:#fff;border-color:var(--brand)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#ov{z-index:40}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.mini{min-height:40px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--soft);color:var(--brand);font-weight:700;cursor:pointer}
.tabs .btn{font-size:13px}
.rnote2{margin-top:8px;padding:8px 10px;border-radius:10px;background:#fde3e1;color:#a3261d;font-size:13.5px;line-height:1.6}
.pk{position:relative}.pl{display:none;position:absolute;inset-inline:0;top:100%;z-index:5;max-height:220px;overflow:auto;background:var(--card);border:1.5px solid var(--line);border-radius:12px;box-shadow:0 12px 24px -10px rgba(0,0,0,.35)}
.pi{padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}.pi small{display:block;color:var(--mut);font-size:12.5px}.pi.add{color:var(--brand);font-weight:700}
.geo{font-size:13px;color:var(--brand);min-height:20px;margin-top:2px}
#busy{position:fixed;top:0;inset-inline:0;height:3px;background:var(--brand);z-index:99;display:none;animation:bz 1s infinite alternate}@keyframes bz{from{opacity:.25}to{opacity:1}}
.tabs{display:flex;gap:6px;padding:10px 14px 0}.tabs .btn{flex:1;min-height:44px;padding:0 6px}.tabs .btn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.sc{font-size:26px;font-weight:800;color:var(--brand)}.kt{width:100%;border-collapse:collapse;font-size:13px}.kt td,.kt th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:start}
/* preview shell */
#pv{position:fixed;inset:0;background:#8a9a9b;z-index:30;display:none;flex-direction:column}
#pv.on{display:flex}
.pvbar{display:flex;gap:8px;padding:8px;background:var(--card);flex-wrap:wrap}
.pvbar .btn{flex:1;min-height:44px;padding:0 10px;font-size:14px}
.pvscroll{flex:1;overflow:auto;padding:10px}
/* #stage takes the size the report is shown at (so nothing scrolls into blank space); the report inside is scaled from its top-right corner */
#stage{margin:0 auto;position:relative;overflow:hidden}#stage>.report{margin:0;transform-origin:top right}
.pvzoom{position:absolute;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:2}
.pvzoom button{width:46px;height:46px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font:800 24px/1 Tajawal,Tahoma,Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer}.pvzoom button:disabled{opacity:.4}
/* ===== REPORT TEMPLATE (independent of the entry UI) ===== */
.report{--rb:var(--brand);width:210mm;min-height:297mm;background:#fff;color:#14282a;padding:12mm;margin:0 auto;direction:rtl;font:500 11px/1.45 Tajawal,Tahoma,Arial,sans-serif}
.rh{display:flex;gap:10px;align-items:center;border-bottom:2px solid var(--rb);padding-bottom:8px}
.logo{width:42px;height:42px;border-radius:10px;background:var(--rb);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.rh .co{font-size:15px;font-weight:800;color:var(--rb)}.rh .ti{font-size:12px;color:#5d7274}
.rinfo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0;font-size:10.5px}
.rinfo div{background:#f1f6f6;border-radius:6px;padding:4px 8px}.rinfo b{display:block;color:#5d7274;font-weight:500;font-size:9.5px}
.rnote{border-right:3px solid var(--rb);background:#f8fbfb;padding:5px 9px;margin-bottom:8px}
.rsec{margin:10px 0 5px;font-size:12px;font-weight:800;color:var(--rb)}
.v{border:1px solid #d3dfdf;border-radius:5px;margin-bottom:4px;break-inside:avoid;overflow:hidden}
.v .h{display:flex;gap:8px;background:#eef5f5;padding:3px 8px;font-weight:800}
.v .h i{font-style:normal;color:var(--rb);border-inline-end:1px solid #b9cccc;padding-inline-end:8px}
.v .d{padding:3px 8px;display:flex;flex-wrap:wrap;gap:2px 0;font-size:10px}
.v .d span+span:before{content:"│";color:#aab9b9;margin:0 6px}
.sum{margin-top:10px;display:flex;gap:6px;break-inside:avoid}
.sum div{flex:1;text-align:center;background:var(--rb);color:#fff;border-radius:6px;padding:5px;font-size:10.5px}
.sum b{font-size:15px;display:block}
.rf{margin-top:10px;border-top:1px solid #d3dfdf;padding-top:5px;display:flex;justify-content:space-between;font-size:9px;color:#5d7274}
@page{size:A4;margin:10mm 0 14mm;@bottom-center{content:"صفحة " counter(page) " من " counter(pages);font:9px Tajawal,Arial,sans-serif;color:#5d7274}}
@media print{
 body>*:not(#pv){display:none!important}
 #pv{position:static;display:block!important;background:#fff}
 .pvbar{display:none!important}.pvscroll{overflow:visible;padding:0}
 #stage{transform:none!important;width:auto!important;height:auto!important;overflow:visible!important}#stage>.report{transform:none!important}.pvzoom{display:none!important}
 .report{width:auto;min-height:0;padding:0 12mm;margin:0}
 .rf,.rloc{display:none}
}
.tgb{flex:none;min-width:38px;min-height:38px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-size:16px;line-height:1;cursor:pointer;padding:0 8px}
.top.adm .tgb{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.12);min-width:42px;min-height:42px;margin-inline-end:6px}
.tgok{margin:12px 0 6px;font-weight:800;color:var(--ok,#1a7f4b)}.tgtx{color:var(--mut);margin:8px 0}.tgsteps{margin:6px 0 12px;padding-inline-start:20px;line-height:1.9}#tg_go{display:flex;align-items:center;justify-content:center;text-decoration:none;margin-bottom:8px}
</style>

<style id="rep-ui">
