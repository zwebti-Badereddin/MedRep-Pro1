<script>
(window.__parts=window.__parts||[]).push("App2");
function drawY(){const y=CM.yr;if(!y||!$("#cyr"))return;const rows=CM.data.reps.map(rp=>{const a=y.avg[rp.id]||{},c=y.years.map(v=>a[v]),l=c[c.length-1],p=c[c.length-2],dl=(l!=null&&p!=null)?l-p:null;
 return `<tr><th>${esc(rp.name)}</th>${c.map(v=>`<td>${v==null?"—":v+"%"}</td>`).join("")}<td>${dl==null?"—":(dl>0?"▲ ":dl<0?"▼ ":"")+Math.abs(dl)}</td></tr>`}).join("");
 $("#cyr").innerHTML=`<h3 style="margin:0 0 8px">متوسط الدرجة بين السنوات</h3><div style="overflow-x:auto"><table class="kt"><tr><th>المندوب</th>${y.years.map(v=>`<th>${v}</th>`).join("")}<th>التغيّر</th></tr>${rows}</table></div>`}
/* ----- records review: new / all / disabled; review, edit(rename), merge, disable ----- */
let MS={ent:"Doctors",rows:[]};
function tabM(){
 $("#av").innerHTML=`<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><button class="btn" data-e="Doctors">الأطباء</button><button class="btn" data-e="Facilities">المنشآت</button><button class="btn" data-e="Pharmacies">الصيدليات</button><button class="btn" data-e="Reps">المندوبون</button></div>
 <div class="two" style="margin-top:8px"><select id="mf"><option value="new">المضافة حديثًا</option><option value="all">الكل</option><option value="off">المعطّلة</option></select><input id="mq" placeholder="بحث بالاسم"></div><div id="ml" style="margin-top:12px"></div>`;
 document.querySelectorAll("[data-e]").forEach(b=>{b.classList.toggle("pri",b.dataset.e===MS.ent);b.onclick=()=>{MS.ent=b.dataset.e;tabM()}});
 if(MS.ent==="Reps")$("#mf").innerHTML='<option value="all">الكل</option><option value="act">الفعّالون</option><option value="off">المعطّلون</option>';
 if(MS.ent==="Facilities")$("#mf").innerHTML='<option value="new">تحتاج مراجعة</option><option value="links">ارتباطات أطباء بانتظار الاعتماد</option><option value="all">الكل</option><option value="off">المعطّلة والمدموجة</option>';
 if(IMPORT_COLS[MS.ent]){$("#ml").insertAdjacentHTML("beforebegin",'<button class="btn dash" id="impBtn" style="margin-top:8px">استيراد '+IMPORT_NAMES[MS.ent]+' من Excel</button>');$("#impBtn").onclick=()=>openImport(MS.ent)}
 $("#mf").onchange=drawM;$("#mq").oninput=drawM;loadM();
}
async function loadM(){const nav=adminNavSeq,ent=MS.ent;try{const rows=await srv(ent==="Reps"?"repsList":ent==="Facilities"?"facilitiesList":"masterList",{entity:ent});if(nav!==adminNavSeq||!$("#ml")||ent!==MS.ent)return;MS.rows=rows;if(MS.ent==="Reps")REPS=MS.rows.map(r=>({id:r.id,name:r.name}))}catch(e){if(nav===adminNavSeq)toast(e.message);return}drawM()}
function drawM(){if(!$("#mf"))return;if(MS.ent==="Reps")return drawR();if(MS.ent==="Facilities")return drawFacilities();
 const f=$("#mf").value,q=norm($("#mq").value),dr=MS.ent==="Doctors",isOff=r=>String(r.active)==="false",isNew=r=>!!r.addedBy&&String(r.reviewed)!=="true"&&!isOff(r);
 const a=MS.rows.filter(r=>(f==="new"?isNew(r):f==="off"?isOff(r):true)&&(!q||norm(r.name).indexOf(q)>=0));
 $("#ml").innerHTML=a.length?a.map(r=>{const hasL=r.lat!==""&&r.lat!=null&&isFinite(+r.lat)&&r.lng!==""&&r.lng!=null&&isFinite(+r.lng),pend=hasL&&(r.refBy!=="ADMIN_MAP"||r.refState!=="مؤكد"),ls=dr?"مرجع الزيارة من مكان العمل":!hasL?"لا موقع مسجّل":pend?"الموقع غير معتمد":"الموقع مؤكد ✓",by=isNew(r)?((REPS.find(x=>x.id===r.addedBy)||{}).name||""):"",sub=dr?[r.specialty,r.workplace].filter(Boolean).join(" · "):[r.location,r.nearFacility].filter(Boolean).join(" · ");
  return `<div class="row" data-id="${esc(r.id)}" style="display:block;${isOff(r)?"opacity:.65":""}"><b>${esc(r.name)}</b>${isNew(r)?' <span class="st s1">جديد</span>':""}
  <div style="color:var(--mut);font-size:13px">${esc(sub)}${sub?" · ":""}${r.uses} زيارة · ${ls}${by?" · أضافه "+esc(by):""}</div>
  <div class="acts">${isNew(r)?'<button class="mini" data-a="review">اعتماد</button>':""}<button class="mini" data-a="edit">تعديل</button><button class="mini" data-a="merge">دمج</button>${!dr?'<button class="mini" data-a="map">تحديد الموقع من الخريطة</button>':""}${!dr&&pend&&r.refBy==="ADMIN_MAP"?'<button class="mini" data-a="approveLoc">اعتماد الموقع</button>':""}${!dr&&hasL?`<a class="mini" href="https:\/\/www.openstreetmap.org/?mlat=${r.lat}&mlon=${r.lng}#map=18/${r.lat}/${r.lng}" target="_blank" rel="noopener" style="display:inline-grid;place-items:center;text-decoration:none">الخريطة</a><button class="mini" data-a="clearLoc">مسح الموقع</button>`:""}<button class="mini" data-a="toggle">${isOff(r)?"تفعيل":"تعطيل"}</button></div></div>`}).join(""):'<div class="empty">لا توجد سجلات.</div>';
 document.querySelectorAll("#ml button.mini").forEach(b=>b.onclick=()=>{const id=b.closest(".row").dataset.id,r=MS.rows.find(x=>x.id===id),o=b.dataset.a;
  if(o==="clearLoc"&&!b.dataset.c){b.dataset.c=1;b.textContent="تأكيد المسح؟";return}
  if(o==="edit")mEdit(r);else if(o==="merge")mMerge(r);else if(o==="map")openWorkplaceMap(r);else mAct(id,o)});
}
/* Facility model V2: one row per facility (the shared GPS reference) with the doctors linked to it. */
function drawFacilities(){
 if(!$("#mf"))return;
 const f=$("#mf").value,q=norm($("#mq").value),off=r=>String(r.status)==="معطل"||!!r.mergedInto;
 const has=r=>r.lat!==""&&r.lat!=null&&isFinite(+r.lat)&&r.lng!==""&&r.lng!=null&&isFinite(+r.lng);
 const pend=r=>(r.links||[]).filter(l=>l.active&&l.linkState==="بانتظار");
 const needs=r=>!off(r)&&(!r.approved||pend(r).length>0);
 const a=MS.rows.filter(r=>(f==="new"?needs(r):f==="links"?pend(r).length>0:f==="off"?off(r):!r.mergedInto)&&(!q||norm(r.name+" "+(r.links||[]).map(l=>l.doctorName).join(" ")).includes(q)));
 const geo=r=>!has(r)?"لا إحداثيات":r.approved?"الموقع معتمد ✓":r.geoSource==="REP_PROPOSAL"?"إحداثيات مقترحة من المندوب — غير معتمدة":r.geoSource==="ADMIN_IMPORT"?"إحداثيات مستوردة من Excel — راجعها واعتمدها":"الموقع بانتظار الاعتماد";
 $("#ml").innerHTML='<button class="btn dash" id="facAdd">＋ إضافة منشأة</button><div style="height:10px"></div>'+(a.length?a.map(r=>{
  const docs=(r.links||[]).filter(l=>l.active&&l.linkState!=="مرفوض");
  return '<div class="row" data-id="'+esc(r.id)+'" style="display:block;'+(off(r)?"opacity:.65":"")+'"><b>'+esc(r.name)+'</b> '+
  (r.mergedInto?'<span class="st s4">مدموجة</span>':off(r)?'<span class="st s4">معطّلة</span>':!r.approved?'<span class="st s1">الموقع بانتظار الاعتماد</span>':'')+
  '<div style="color:var(--mut);font-size:13px">'+esc(r.type||"—")+' · '+r.uses+' زيارة · '+docs.length+' طبيب · '+geo(r)+'</div>'+
  (has(r)?'<div style="font-size:12px;color:var(--mut);margin-top:4px">الإحداثيات: '+(+r.lat).toFixed(6)+', '+(+r.lng).toFixed(6)+'</div>':'')+
  (docs.length?'<div style="font-size:12px;margin-top:6px">الأطباء: '+docs.map(l=>'<span style="display:inline-flex;gap:4px;align-items:center;margin:2px 8px 2px 0">'+esc(l.doctorName)+
   (l.linkState==="بانتظار"?' <span class="st s1">ربط جديد</span><button class="mini" type="button" data-l="approve" data-lid="'+esc(l.id)+'">اعتماد</button><button class="mini" type="button" data-l="reject" data-lid="'+esc(l.id)+'">رفض</button>':'')+'</span>').join("")+'</div>':'')+
  (r.mergedInto?'':'<div class="acts"><button class="mini" data-a="map">'+((r.geoSource==="REP_PROPOSAL"||r.geoSource==="ADMIN_IMPORT")&&!r.approved?"مراجعة الموقع واعتماده من الخريطة":"تحديد الموقع على الخريطة")+'</button>'+
   (has(r)?'<a class="mini" href="https:\/\/www.openstreetmap.org/?mlat='+encodeURIComponent(r.lat)+'&mlon='+encodeURIComponent(r.lng)+'#map=18/'+encodeURIComponent(r.lat)+'/'+encodeURIComponent(r.lng)+'" target="_blank" rel="noopener" style="display:inline-grid;place-items:center;text-decoration:none">عرض الموقع</a><button class="mini" data-a="clearLoc">مسح GPS</button>':'')+
   '<button class="mini" data-a="edit">تعديل</button><button class="mini" data-a="merge">دمج</button><button class="mini" data-a="toggle">'+(off(r)?"تفعيل":"تعطيل")+'</button></div>')+'</div>';
 }).join(""):'<div class="empty">لا توجد منشآت مطابقة.</div>');
 $("#facAdd").onclick=()=>facilityForm(null);
 document.querySelectorAll("#ml button[data-l]").forEach(b=>b.onclick=async()=>{try{await srv("linkAct",{id:b.dataset.lid,op:b.dataset.l});toast("تم");await loadM()}catch(e){toast(e.message)}});
 document.querySelectorAll("#ml button[data-a]").forEach(b=>b.onclick=()=>{
  const id=b.closest(".row").dataset.id,r=MS.rows.find(x=>x.id===id),op=b.dataset.a;
  if(op==="clearLoc"&&!b.dataset.c){b.dataset.c=1;b.textContent="تأكيد المسح؟";return}
  if(op==="map")openWorkplaceMap({id:r.id,workplace:r.name,doctorName:"",lat:r.lat,lng:r.lng});
  else if(op==="edit")facilityForm(r);
  else if(op==="merge")fMerge(r);
  else mAct(id,op)
 });
}
/* Add / edit a facility in one sheet. Adding shows similar facilities (same name or < 100 m) inside the form first. */
const FAC_TYPES=["منشأة طبية","مستشفى","مصحة","عيادة","مركز صحي","مستوصف"];
function facilityFormHtml(r){
 const t=r&&r.type?r.type:"منشأة طبية",types=FAC_TYPES.indexOf(t)>=0?FAC_TYPES:FAC_TYPES.concat([t]);
 return '<h3>'+(r?"تعديل منشأة":"إضافة منشأة")+'</h3>'+
  '<label for="fc_name">اسم المنشأة *</label><input id="fc_name" maxlength="120" value="'+esc(r?r.name:"")+'" placeholder="مثال: مصحة الشفاء">'+
  '<label for="fc_type">نوع المنشأة</label><select id="fc_type">'+types.map(x=>'<option'+(x===t?" selected":"")+'>'+esc(x)+'</option>').join("")+'</select>'+
  '<div class="empty" style="text-align:right;margin-top:10px">'+(r?"تغيير الاسم لا يغيّر إحداثيات المنشأة ولا ارتباطات الأطباء بها.":"بعد الإضافة حدّد موقع المنشأة من الخريطة ليُعتمد مرجعًا للتحقق من الزيارات.")+'</div>'+
  '<div id="fc_similar"></div><div class="err" id="ferr"></div>'+
  '<div class="mfoot"><button type="button" class="btn" id="cx">إلغاء</button><button type="button" class="btn pri" id="sv">'+(r?"حفظ التعديل":"إضافة المنشأة")+'</button></div>';
}
function similarFacilitiesHtml(list){
 return '<div class="ap-sec"><b>توجد منشأة مسجلة مشابهة — تأكد أنها ليست نفسها:</b>'+list.map(x=>'<div class="ap-row"><div class="ap-t">'+esc(x.name)+'</div>'+(x.distance!=null?'<span class="st">'+x.distance+' م</span>':'')+'</div>').join("")+'</div>';
}
/* Bulk import: paste columns copied from Excel (tab-separated), preview, then add. Existing names are never duplicated. */
const IMPORT_COLS={Doctors:"الاسم · التخصص · القطاع (خاص أو عام)",Pharmacies:"الاسم · العنوان · أقرب منشأة",Facilities:"الاسم · النوع · العنوان · خط العرض · خط الطول"};
const IMPORT_NAMES={Doctors:"أطباء",Pharmacies:"صيدليات",Facilities:"منشآت"};
const parsePasted=t=>String(t||"").split(/\r?\n/).map(l=>l.split("\t"));
function importResultHtml(r,committed){
 const li=(a,f)=>a.length?'<ul>'+a.slice(0,50).map(f).join("")+(a.length>50?'<li>… و'+(a.length-50)+' غيرها</li>':"")+'</ul>':"";
 return '<div class="imres"><div class="ims"><span>'+(committed?"أُضيف ":"سيُضاف ")+(committed?r.added:r.add.length)+'</span><span>موجود مسبقًا '+r.dup.length+'</span><span>غير صالح '+r.invalid.length+'</span></div>'+
  (committed?"":li(r.add,x=>'<li>'+esc(x.name)+(x.specialty||x.location||x.address?' · '+esc(x.specialty||x.location||x.address):"")+(x.lat!==""&&x.lat!=null?' · 📍':"")+'</li>'))+
  (r.dup.length?'<b>لن يُضاف لأنه موجود:</b>'+li(r.dup,x=>'<li>سطر '+x.line+': '+esc(x.name)+' ← '+esc(x.existing)+'</li>'):"")+
  (r.invalid.length?'<b>أسطر غير صالحة:</b>'+li(r.invalid,x=>'<li>سطر '+x.line+': '+esc(x.reason)+'</li>'):"")+'</div>'}
function openImport(ent){
 $("#modal").innerHTML='<h3>استيراد '+IMPORT_NAMES[ent]+' من Excel</h3>'+
  '<div class="empty" style="text-align:right">انسخ من Excel الأعمدة بهذا الترتيب: <b>'+IMPORT_COLS[ent]+'</b> ثم الصقها هنا. يكفي عمود الاسم وحده. أقصى عدد 1000 سطر.'+(ent==="Facilities"?' الإحداثيات اختيارية، ويمكن لصقها من خرائط Google في عمود واحد بالشكل «32.88, 13.17». المواقع المستوردة لا تُعتمد تلقائيًا: راجع كل منشأة من الخريطة واعتمد موقعها.':"")+'</div>'+
  '<textarea id="im_t" rows="8" dir="auto"></textarea><div id="im_r"></div><div class="err" id="im_e"></div>'+
  '<div class="mfoot"><button type="button" class="btn" id="cx">إغلاق</button><button type="button" class="btn pri" id="sv">معاينة</button></div>';
 $("#ov").classList.add("on");$("#im_t").focus();
 let ready=false;
 $("#cx").onclick=()=>$("#ov").classList.remove("on");
 $("#im_t").oninput=()=>{ready=false;$("#sv").textContent="معاينة";$("#im_r").innerHTML=""};
 $("#sv").onclick=async()=>{const b=$("#sv"),rows=parsePasted($("#im_t").value);$("#im_e").textContent="";
  if(!rows.some(r=>r.join("").trim())){$("#im_e").textContent="الصق الأسماء أولًا.";return}
  b.disabled=true;
  try{const out=await srv("importMaster",{entity:ent,rows:rows,commit:ready});
   $("#im_r").innerHTML=importResultHtml(out,ready);
   if(ready){toast("تمت إضافة "+out.added);b.style.display="none";$("#im_t").disabled=true;await loadM();return}
   if(out.add.length){ready=true;b.textContent="إضافة "+out.add.length}else $("#im_e").textContent="لا يوجد جديد لإضافته."}
  catch(e){$("#im_e").textContent=e.message}finally{b.disabled=false}};
}
function facilityForm(r){
 $("#modal").innerHTML=facilityFormHtml(r);$("#ov").classList.add("on");
 let confirmNew=false;
 $("#cx").onclick=()=>$("#ov").classList.remove("on");
 $("#fc_name").focus();
 $("#sv").onclick=async()=>{
  const row={name:$("#fc_name").value.trim(),type:$("#fc_type").value},err=$("#ferr");err.textContent="";
  if(row.name.length<2){err.textContent="أدخل اسم المنشأة.";$("#fc_name").focus();return}
  if(r){mAct(r.id,"edit",{row});return}
  const b=$("#sv");b.disabled=true;
  try{
   const out=await srv("facilityAct",{op:"create",confirmNew,row});
   if(out.similar){$("#fc_similar").innerHTML=similarFacilitiesHtml(out.similar);confirmNew=true;b.textContent="إضافة منشأة جديدة رغم ذلك";b.disabled=false;return}
   $("#ov").classList.remove("on");toast("تمت إضافة المنشأة. حدّد موقعها من الخريطة.");await loadM();
  }catch(e){err.textContent=e.message;b.disabled=false}
 };
}
function fMerge(r){const oth=MS.rows.filter(x=>x.id!==r.id&&!x.mergedInto&&String(x.status)!=="معطل").sort((a,b)=>a.name.localeCompare(b.name,"ar"));
 $("#modal").innerHTML=`<h3>دمج «${esc(r.name)}»</h3><p style="color:var(--mut);font-size:14px;line-height:1.7">تُنقل ارتباطات الأطباء إلى المنشأة التي تختارها وتُعطَّل هذه المنشأة. التقارير القديمة تبقى كما هي وتُحتسب على المنشأة الجديدة تلقائيًا.</p>
 <label>دمج داخل</label><input id="m_q" placeholder="ابحث"><select id="m_s" size="6" style="height:auto;margin-top:8px"></select><div class="err" id="ferr"></div>
 <div class="two" style="margin-top:14px"><button class="btn" id="cx">إلغاء</button><button class="btn pri" id="sv">دمج</button></div>`;
 const fill=()=>{const q=norm($("#m_q").value);$("#m_s").innerHTML=oth.filter(x=>!q||norm(x.name).indexOf(q)>=0).slice(0,50).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("")};fill();$("#m_q").oninput=fill;
 $("#ov").classList.add("on");$("#cx").onclick=()=>$("#ov").classList.remove("on");
 $("#sv").onclick=()=>{const v=$("#m_s").value;if(!v){$("#ferr").textContent="اختر المنشأة المراد الدمج داخلها.";return}mAct(r.id,"merge",{into:v})};}
let workplaceMapInstance=null,workplaceMapMarker=null,workplaceMapPoint=null,workplaceMapLibPromise=null;
function loadWorkplaceMapLib(){
 if(workplaceMapLibPromise)return workplaceMapLibPromise;
 workplaceMapLibPromise=new Promise((resolve,reject)=>{
  if(window.L){resolve();return}
  if(!document.querySelector('link[data-workplace-leaflet]')){
   const css=document.createElement("link");css.rel="stylesheet";css.href="https:\/\/unpkg.com/leaflet@1.9.4/dist/leaflet.css";css.dataset.workplaceLeaflet="1";document.head.appendChild(css);
  }
  const script=document.createElement("script");script.src="https:\/\/unpkg.com/leaflet@1.9.4/dist/leaflet.js";script.onload=resolve;script.onerror=()=>{workplaceMapLibPromise=null;reject(new Error("تعذر تحميل مكتبة الخريطة. تحقق من الاتصال بالإنترنت ثم حاول مجددًا."))};document.head.appendChild(script);
 });
 return workplaceMapLibPromise;
}
function openWorkplaceMap(w){
 workplaceMapMarker=null;
 workplaceMapPoint=(w.lat!==""&&w.lat!=null&&isFinite(+w.lat)&&w.lng!==""&&w.lng!=null&&isFinite(+w.lng))?{lat:+w.lat,lng:+w.lng}:null;
 $("#modal").innerHTML='<h3>تحديد موقع المنشأة الطبية</h3><div style="font-size:13px;color:var(--mut);margin-bottom:8px">الطبيب: <b>'+esc(w.doctorName||w.name||"") +'</b><br>المكان: <b>'+esc(w.workplace||w.location||w.nearFacility||"")+'</b></div>'+
 '<form id="wpSearch" style="display:flex;gap:7px;margin:8px 0"><input id="wpQuery" placeholder="ابحث عن اسم المنشأة أو العنوان" value="'+esc((w.workplace ? w.workplace : (w.location ? w.location : w.name))+" "+(w.doctorName ? w.doctorName : ""))+'" style="min-width:0;flex:1"><button class="btn" type="submit" style="white-space:nowrap">بحث</button></form>'+
 '<div id="wpSearchStatus" style="font-size:12px;color:var(--mut);min-height:20px"></div><div id="wpMap" style="height:350px;min-height:300px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft)"></div>'+
 '<div id="wpCoords" style="font-size:13px;color:var(--mut);margin:8px 0">انقر على الخريطة لتحديد الموقع الدقيق.</div>'+
 '<div class="two" style="margin:4px 0"><input id="wpLat" inputmode="decimal" dir="ltr" autocomplete="off" placeholder="خط العرض Latitude" aria-label="خط العرض"><input id="wpLng" inputmode="decimal" dir="ltr" autocomplete="off" placeholder="خط الطول Longitude" aria-label="خط الطول"></div><button class="btn" id="wpGo" type="button">تحديد على الخريطة</button><div class="err" id="wpCoordErr"></div>'+
 '<div class="two" style="margin-top:12px"><button class="btn" id="wpCancel" type="button">إلغاء</button><button class="btn pri" id="wpSave" type="button" disabled>حفظ موقع المنشأة</button></div>'+
 '<div style="font-size:11px;color:var(--mut);margin-top:8px">الخريطة والبحث الجغرافي من OpenStreetMap/Nominatim. تحقق بصريًا من موقع المنشأة قبل الحفظ.</div>';
 $("#ov").classList.add("on");
 $("#wpCancel").onclick=()=>{$("#ov").classList.remove("on");if(workplaceMapInstance){workplaceMapInstance.remove();workplaceMapInstance=null}workplaceMapMarker=null};
 $("#wpSave").onclick=()=>{if(!workplaceMapPoint)return;const point={lat:workplaceMapPoint.lat,lng:workplaceMapPoint.lng};if(workplaceMapInstance){workplaceMapInstance.remove();workplaceMapInstance=null}workplaceMapMarker=null;mAct(w.id,"setLoc",point)};

function visitChips(v,k){
 const c=[],chip=(t,cls,ic)=>'<span class="chip'+(cls?" "+cls:"")+'">'+(ic||"")+esc(t)+'</span>';
 if(v.time)c.push(chip(v.time));
 if(k==="d"){
  if(v.intro)c.push(chip("تعريف: "+v.intro));
  if(v.remind&&v.remind!=="—")c.push(chip("تذكير: "+v.remind));
  const sm=sampleText(v);if(sm)c.push(chip("عينات: "+sm));
 }else{
  if(v.product)c.push(chip(v.product));
  if(v.order)c.push(chip("طلبية: "+v.order));
 }
 const g=v.gps||{};
 c.push(typeof g.lat==="number"&&typeof g.lng==="number"?chip(" الموقع مسجّل","ok",IC.pin):chip(" بدون موقع — يُلتقط عند الحفظ","off",IC.nopin));

}
