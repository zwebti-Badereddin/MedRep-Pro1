<script>
(window.__parts=window.__parts||[]).push("App3");
/* Doctor-visit facility choices (facility model V2): every option value is a facility ID. The doctor's linked facilities come
   first, then every other registered facility; picking one he is not linked to yet creates a link request for the administration. */
function workplaceChoices(doc,facilities){
 const on=w=>String(w.active)!=="false",own=((doc&&doc.workplaces)||[]).filter(on),mine=new Set(own.map(w=>String(w.id)));
 return {own,other:(facilities||[]).filter(w=>on(w)&&!mine.has(String(w.id)))};
}
function workplaceOptions(c){
 const o=(w,tag)=>'<option value="'+esc(w.id)+'" data-place="'+esc(w.workplace)+'">'+esc(w.workplace)+(tag||"")+(w.reviewed?'':' (الموقع بانتظار اعتماد الإدارة)')+'</option>';
 return c.own.map(w=>o(w,w.linked===false?' (الربط بانتظار الاعتماد)':'')).join("")+(c.other.length?'<optgroup label="منشآت مسجلة أخرى (يُطلب ربط الطبيب بها)">'+c.other.map(w=>o(w)).join("")+'</optgroup>':"")+'<option value="__new__">＋ اقتراح منشأة جديدة</option>';
}
function pickWorkplace(c,cur){
 const id=cur.facilityId,key=norm(cur.place),find=list=>(id&&list.find(w=>String(w.id)===String(id)))||(key&&list.find(w=>norm(w.workplace)===key))||null;
 const own=find(c.own);if(own)return {value:own.id,w:own,link:false};
 const other=find(c.other);return other?{value:other.id,w:other,link:true}:null;
}
function rememberWorkplace(rec,wp){
 const d=(CFG.docs||[]).find(x=>x.id===rec.id)||rec;d.workplaces=d.workplaces||[];
 if(!d.workplaces.some(w=>String(w.id)===String(wp.id)))d.workplaces.push({id:wp.id,workplace:wp.workplace,reviewed:wp.reviewed,linked:wp.linked});rec.workplaces=d.workplaces;
}
const isLinkOption=sel=>{const o=sel.selectedOptions[0];return !!o&&(!!o.closest("optgroup")||o.dataset.link==="1")};
function setupPicker(recs,fill,lbl){
 const inp=$("#f_name"),box=$("#f_name_l"),hint=$("#f_name_h");
  const sub=r=>r.specialty?(r.specialty+((r.workplaces||[]).length?" · "+r.workplaces.map(w=>w.workplace).join("، "):r.workplace?" · "+r.workplace:"")):(r.location||"");
 const draw=()=>{const q=norm(inp.value),t=inp.value.trim(),m=recs.filter(r=>!q||norm(r.name).indexOf(q)>=0).slice(0,40);
  box.innerHTML=m.map((r,i)=>`<div class="pi" data-i="${i}">${esc(r.name)}<small>${esc(sub(r))}</small></div>`).join("")+(t&&!recs.some(r=>norm(r.name)===q)?`<div class="pi add" data-a="1">＋ إضافة ${lbl} «${esc(t)}»</div>`:"");
  box.style.display=box.innerHTML?"block":"none";box._m=m};
 inp.oninput=()=>{PK={rec:null,isNew:false};hint.textContent="";draw()};inp.onfocus=draw;
 inp.onblur=()=>setTimeout(()=>{box.style.display="none"},180);
 box.onpointerdown=e=>{const it=e.target.closest(".pi");if(!it)return;e.preventDefault();
  if(it.dataset.a){PK={rec:null,isNew:true};hint.textContent="✓ سيُضاف إلى القائمة عند حفظ الزيارة";if(fill)fill({isNew:true})}
  else{const r=box._m[+it.dataset.i];PK={rec:r,isNew:false};inp.value=r.name;hint.textContent="";fill(r)}
  box.style.display="none"};
}
/* Free samples: a list of {product, qty}. Older visits stored up to two names in s1/s2 (one sample each). */
function normSamples(v){
 if(v&&Array.isArray(v.samples))return v.samples.filter(x=>x&&x.product&&x.product!=="—").map(x=>({product:String(x.product),qty:Math.max(1,Math.min(99,Math.round(+x.qty)||1))}));
 return [v&&v.s1,v&&v.s2].filter(x=>x&&x!=="—").map(p=>({product:String(p),qty:1}));
}
function mergeSamples(list){
 const m=new Map();
 (list||[]).forEach(x=>{if(!x||!x.product||x.product==="—")return;m.set(x.product,Math.min(99,(m.get(x.product)||0)+Math.max(1,Math.round(+x.qty)||1)))});
 return Array.from(m,([product,qty])=>({product,qty}));
}
function sampleText(v){
 return mergeSamples(normSamples(v)).map(x=>x.product+(x.qty>1?" ×"+x.qty:"")).join(" · ");
}

 <div id="f_samples"></div><button class="fchip add" type="button" id="f_sample_add">+ إضافة عينة</button>`
 :`<div class="vf-head"><h3>${idx!=null?"تعديل":"إضافة"} زيارة صيدلية</h3><span id="geo" class="gpspill"></span></div>
 <div class="step"><span>1</span>الصيدلية</div>

 <label for="f_loc">موقع الصيدلية</label><input id="f_loc" value="${f("loc")}">

 ${seg("time",cur.time||"صباحًا")}
 <label for="f_product">المنتج المراد التعريف به</label><select id="f_product">${opts(CFG.products,cur.product)}</select>
 <label for="f_act">النشاط داخل الصيدلية</label><input id="f_act" value="${f("act")}">

 if($("#np_gps")){document.querySelectorAll("input[name=np_where]").forEach(x=>x.onchange=npStatus);$("#np_retry").onclick=()=>{const prev=GEO;startGeo();if(prev&&!GEO)GEO=prev;npStatus()};$("#np_manual_t").onclick=()=>{const m=$("#np_manual");m.style.display=m.style.display==="none"?"block":"none";npStatus()};$("#f_newlat").oninput=$("#f_newlng").oninput=npStatus;npStatus()}
 let smp=k==="d"?mergeSamples(normSamples(cur)):[];
 if(k==="d"){

  if(name.length<2){specMsg.textContent="أدخل اسم تخصص من حرفين على الأقل.";return}
  specSave.disabled=true;specMsg.textContent="جارٍ حفظ التخصص…";
  try{
   const out=await srv("addSpecialty",{name});
   CFG.specialties=out.specialties||CFG.specialties;
   $("#f_spec").innerHTML=opts(CFG.specialties,out.name||name);
   $("#f_spec").value=out.name||name;
   specInput.value="";specWrap.style.display="none";
   toast(out.existing?"التخصص موجود مسبقًا وتم اختياره.":"تم حفظ التخصص وإضافته للقائمة.");
  }catch(e){specMsg.textContent=e.message||"تعذر حفظ التخصص."}
  finally{specSave.disabled=false}
 };
 // Step 4: one row per sample product with a quantity stepper.
 const drawSamples=()=>{
  const prods=CFG.products||[];
  $("#f_samples").innerHTML=smp.map((x,i)=>`<div class="srow"><select data-sp="${i}" aria-label="صنف العينة ${i+1}">${opts(prods.indexOf(x.product)>=0?prods:prods.concat([x.product]),x.product)}</select><div class="stepper"><button type="button" data-sm="${i}" aria-label="إنقاص العدد">−</button><output aria-label="العدد">${x.qty}</output><button type="button" class="plus" data-sa="${i}" aria-label="زيادة العدد">+</button></div></div>`).join("");
  document.querySelectorAll("#f_samples [data-sp]").forEach(s=>s.onchange=()=>{smp[+s.dataset.sp].product=s.value});
  document.querySelectorAll("#f_samples [data-sm]").forEach(b=>b.onclick=()=>{const i=+b.dataset.sm;if(smp[i].qty>1)smp[i].qty--;else smp.splice(i,1);drawSamples()});
  document.querySelectorAll("#f_samples [data-sa]").forEach(b=>b.onclick=()=>{const i=+b.dataset.sa;smp[i].qty=Math.min(99,smp[i].qty+1);drawSamples()});
 };
 $("#f_sample_add").onclick=()=>{const prods=CFG.products||[];if(!prods.length)return;const used=smp.map(x=>x.product),p=prods.find(x=>used.indexOf(x)<0)||prods[0];smp.push({product:p,qty:1});drawSamples()};
 drawSamples();
 }
  {const recs=k==="d"?CFG.docs:CFG.phs;PK={rec:idx!=null?(recs.find(x=>x.name===cur.name)||null):null,isNew:false};
   // Step 1: a picked doctor shows as a card; "تغيير" goes back to the search field.
   const showDoc=r=>{if(k!=="d")return;const card=$("#f_doc_card"),pick=$("#f_doc_pick");if(r&&!r.isNew){$("#f_doc_nm").textContent=r.name;$("#f_doc_sp").textContent=r.specialty||"";card.style.display="flex";pick.style.display="none"}else{card.style.display="none";pick.style.display="block"}};
   // Step 2: the doctor's facilities as buttons; "+ منشأة أخرى" opens the full list (other facilities and a new proposal).
   let FCH={own:[],other:[]};
   const drawFChips=()=>{
    if(k!=="d")return;const sel=$("#f_workplace"),val=sel.value,ownSel=FCH.own.some(w=>String(w.id)===String(val));
    $("#f_fchips").innerHTML=FCH.own.map(w=>`<button type="button" class="fchip${String(w.id)===String(val)?" on":""}" data-fc="${esc(w.id)}" aria-pressed="${String(w.id)===String(val)}">${String(w.id)===String(val)?IC.check+" ":""}${esc(w.workplace)}</button>`).join("")+`<button type="button" class="fchip add${ownSel?"":" on"}" id="f_fc_other">+ منشأة أخرى</button>`;
    $("#f_wp_wrap").style.display=ownSel?"none":"block";
    document.querySelectorAll("#f_fchips [data-fc]").forEach(b=>b.onclick=()=>{sel.value=b.dataset.fc;sel.onchange()});
    // Never pre-select another facility for the rep: an empty choice must be replaced explicitly (saving refuses it).
    $("#f_fc_other").onclick=()=>{if(ownSel){if(![].some.call(sel.options,o=>o.value===""))sel.insertBefore(new Option("— اختر منشأة —",""),sel.firstChild);sel.value="";sel.onchange()}$("#f_wp_wrap").style.display="block";sel.focus()};
   };
   const fillDoctor=r=>{showDoc(r);if(r.isNew){FCH=workplaceChoices(null,CFG.facilities);$("#f_workplace").innerHTML=workplaceOptions(FCH);$("#f_workplace").value="__new__";$("#f_newplace_wrap").style.display="block";$("#f_newplace").value=cur.place||"";if($("#f_newlat"))$("#f_newlat").value=cur.placeLat||"";if($("#f_newlng"))$("#f_newlng").value=cur.placeLng||"";$("#f_place_status").textContent="اختر منشأة مسجلة أو اقترح منشأة جديدة.";drawFChips();return}
    const sp=$("#f_spec");if(r.specialty){if(![].some.call(sp.options,o=>o.value===r.specialty))sp.add(new Option(r.specialty,r.specialty));sp.value=r.specialty}

 let confirmNew=false; // set only by the explicit "create a new facility anyway" button

   if(!rec){if(!PK.isNew){$("#ferr").textContent=k==="d"?"اختر الطبيب من القائمة أو أضفه كطبيب جديد.":"اختر الصيدلية من القائمة أو أضفها كجديدة.";return}
    try{$("#sv").disabled=true;rec=await srv(k==="d"?"addDoctor":"addPharmacy",k==="d"?{name:typed,specialty:g("f_spec"),workplace:"",sector:r("sector")}:{name:typed,location:g("f_loc"),nearFacility:g("f_near")});
     if(!recs.some(x=>x.id===rec.id))recs.push(rec)}catch(e){$("#ferr").textContent=e.message;$("#sv").disabled=false;return}}

       st.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>{const sel=$("#f_workplace"),x=out.similar.find(y=>String(y.id)===b.dataset.use);if(![].some.call(sel.options,o=>o.value===b.dataset.use)){const op=new Option(x.name,x.id);op.dataset.link="1";sel.insertBefore(op,sel.lastElementChild)}sel.value=b.dataset.use;sel.selectedOptions[0].dataset.place=x.name;sel.onchange()});

    }
    // Strict policy: a doctor not yet linked to the facility needs the administration's approval before the visit can be saved.
    if(String((CFG.st||{}).workplacePolicy)==="strict"&&(chosen==="__new__"||isLinkOption($("#f_workplace")))){
     if(chosen!=="__new__"){try{await srv("requestDoctorLink",{doctorId:rec.id,facilityId:placeId,sector:r("sector")})}catch(e){$("#ferr").textContent=e.message;$("#sv").disabled=false;return}}
     $("#ferr").textContent="أُرسل طلب ربط الطبيب بالمنشأة إلى الإدارة. يمكن حفظ الزيارة بعد الاعتماد.";$("#sv").disabled=false;return}
   }
   const v=k==="d"?{name:rec.name,doctorId:rec.id,specialty:g("f_spec"),intro:g("f_intro"),remind:g("f_remind")==="—"?"":g("f_remind"),place:placeName,facilityId:placeId,time:r("time"),sector:r("sector"),samples:mergeSamples(smp)}
    :{name:rec.name,pharmacyId:rec.id,loc:g("f_loc"),near:g("f_near"),time:r("time"),product:g("f_product"),act:g("f_act"),order:g("f_order")};
  const arr=k==="d"?S.docs:S.phs;let ref;
  const freshGps=GEO&&Date.now()-GEO.ts<600000?{lat:GEO.lat,lng:GEO.lng,acc:GEO.acc,ts:GEO.ts}:null;
   if(idx!=null){v.gps=freshGps||cur.gps;arr[idx]=v;ref=v}else{v.gps=freshGps||{status:"غير متاح"};arr.push(v);ref=v}
   if(!ref.gps||typeof ref.gps.lat!=="number")grabGps(ref)
  stopGeo();$("#ov").classList.remove("on");auto();home();
 };
}
function npWhere(){const x=document.querySelector("input[name=np_where]:checked");return x?x.value:"here"}
function npFix(){return GEO&&Date.now()-GEO.ts<600000?GEO:null}
function npStatus(){const e=$("#np_gps");if(!e)return;const la=$("#f_newlat"),ln=$("#f_newlng"),man=!!(la&&ln&&(la.value.trim()||ln.value.trim())),away=npWhere()==="away",fix=npFix();
 if(man)$("#np_manual").style.display="block";$("#np_retry").style.display=away||man?"none":"";
 e.textContent=man?"سيُرسل الموقع الذي أدخلته يدويًا كموقع مقترح.":away?"سيُرسل الاقتراح دون موقع، وتحدد الإدارة الموقع من الخريطة.":fix?(fix.acc<=100?"📍 سيُرسل موقعك الحالي كموقع مقترح (دقة ±"+fix.acc+" م).":"⚠ الموقع ضعيف (دقة ±"+fix.acc+" م). اقترب من باب أو نافذة واضغط «إعادة محاولة تحديد الموقع»، أو احفظ ليُرسل بأفضل دقة متوفرة."):GEO_FAILED?"⚠ تعذّر تحديد الموقع. اضغط «إعادة محاولة تحديد الموقع»، أو احفظ ليُرسل الاقتراح دون موقع وتحدده الإدارة.":"… جارٍ تحديد موقعك"}
function npLocation(){const la=$("#f_newlat").value.trim(),ln=$("#f_newlng").value.trim();
 if(la||ln){const lat=Number(la),lng=Number(ln);if(la===""||ln===""||!isFinite(lat)||!isFinite(lng)||lat<-90||lat>90||lng<-180||lng>180)return{error:"أدخل خط العرض وخط الطول الصحيحين للمنشأة، أو امسحهما ليُستخدم موقعك الحالي."};return{data:{lat:lat,lng:lng,locSource:"manual"}}}
 if(npWhere()==="away")return{data:{locSource:"away"}};
 const fix=npFix();if(fix)return{data:{lat:fix.lat,lng:fix.lng,acc:fix.acc,locSource:fix.acc<=100?"gps":"gps_weak"}};
 return{data:{locSource:"none"}}}
/* GPS is optional and never blocks saving: visit is stored first, location attaches later if available */
function grabGps(v){
 if(!navigator.geolocation)return;
 try{navigator.geolocation.getCurrentPosition(p=>{v.gps={status:p.coords.accuracy<=100?"تم التحقق":"غير متاح",lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,ts:p.timestamp};auto()},()=>{},{timeout:5000,maximumAge:60000})}catch(e){}
}

/* ===== Report template: Report Data -> render() -> Preview / Print / PDF ===== */
function render(d,printable){
  const c=d.company,p2=n=>String(n).padStart(2,"0"),F=(l,t)=>t?`<div class="c"><small>${l}</small>${esc(t)}</div>`:"";
  const gpt=v=>{const g=v.gps||{},status=(!g.status||g.status==="غير متاح")?"غير متاح":g.status,labels={"تم التحقق":"تم التحقق","خارج النطاق":"خارج النطاق","غير حاسم":"غير حاسم — دقة الموقع لا تسمح بالجزم","مرجع غير مؤكد":"المرجع الجغرافي غير معتمد","غير متاح":"غير متاح"};if(printable)return labels[status]||"غير محسوم";if(!d.adm)return typeof g.lat==="number"&&typeof g.lng==="number"?"تم حفظ موقعك":"";return (labels[status]||status)+(g.dist!=null?" ("+g.dist+" م)":"")};
  const docs=d.docs.map((v,i)=>{const sm=sampleText(v),rm=v.remind&&v.remind!=="—"?v.remind:"",pu=v.intro&&rm?"تعريف وتذكير":v.intro?"تعريف":rm?"تذكير":"";
   return `<div class="v"><div class="h"><i>${p2(i+1)}</i><span><b>اسم الطبيب:</b> ${esc(v.name)}</span></div><div class="g">${F("التخصص",v.specialty)}${F("مكان العمل",v.place)}${F("القطاع",v.sector)}${F("وقت الزيارة",v.time)}${F("الغرض من الزيارة",pu)}${F("المنتج المعرَّف به",v.intro)}${F("المنتج المذكَّر به",rm)}${F("العينات المجانية",sm)}${F("التحقق من الموقع",gpt(v))}</div></div>`}).join("");
  const phs=d.phs.map((v,i)=>`<div class="v"><div class="h"><i>${p2(i+1)}</i><span><b>اسم الصيدلية:</b> ${esc(v.name)}</span></div><div class="g">${F("العنوان",v.loc)}${F("أقرب عيادة / مستشفى",v.near)}${F("وقت الزيارة",v.time)}${F("المنتج المعرَّف به",v.product)}${F("النشاط داخل الصيدلية",v.act)}${F("الطلبية",v.order)}${F("التحقق من الموقع",gpt(v))}</div></div>`).join("");
 return `<div class="report" style="--brand:${esc(c.color)}"><div class="rh">${c.logo?`<img src="${esc(c.logo)}" alt="شعار الشركة" style="height:68px;max-width:180px;object-fit:contain">`:`<div class="logo">${esc(c.short)}</div>`}<div><div class="co">${esc(c.name)}</div><div class="ti">${esc(c.title)}</div>${c.phone||c.address?`<div class="ti" style="font-size:10px">${esc([c.address,c.phone].filter(Boolean).join(" · "))}</div>`:""}</div></div>
 <div class="rinfo"><div><b>رقم التقرير</b>${esc(d.no)}</div><div><b>المندوب</b>${esc(d.rep)}</div><div><b>اليوم</b>${esc(d.day)}</div><div><b>التاريخ</b>${esc(d.date)}</div></div>
 ${d.notes?`<div class="rnote"><b>ملاحظة اليوم:</b> ${esc(d.notes)}</div>`:""}
 ${d.docs.length?`<div class="rsec">👨‍⚕️ زيارات الأطباء</div>${docs}`:""}
 ${d.phs.length?`<div class="rsec">🏥 زيارات الصيدليات</div>${phs}`:""}
 <div class="sum"><div><b>${d.docs.length+d.phs.length}</b>إجمالي الزيارات</div><div><b>${d.docs.length}</b>أطباء</div><div><b>${d.phs.length}</b>صيدليات</div></div>
 ${d.adm&&typeof gpsPointValid==="function"&&d.docs.concat(d.phs).some(v=>v&&v.gps&&gpsPointValid(v.gps.lat,v.gps.lng))?'<div class="rloc" style="text-align:center;margin:14px 0 4px"><button class="btn" id="rptloc" type="button">📍 الموقع</button></div>':""}
 <div class="rf"><span>${esc(c.name)}</span><span>${esc(d.no)}</span></div></div>`;
}
function snapshot(){const di=dateInfo(S.date);return JSON.parse(JSON.stringify({company:CFG.company,no:S.no,rep:rep.name,day:di.day,date:di.date,notes:S.notes,docs:S.docs,phs:S.phs}))}
/* The A4 report opens fitted to the screen width; + / − zoom up to 125% (PVZ = zoom relative to the fitted size). */
let PVZ=1;const PV_MAX=1.25;
function fit(){const st=$("#stage"),r=st.firstElementChild;if(!r)return;const w=document.querySelector(".pvscroll").clientWidth-20,pw=r.offsetWidth,base=Math.min(1,w/pw),k=Math.max(base,Math.min(PV_MAX,base*PVZ));PVZ=k/base;
 r.style.transform=`scale(${k})`;st.style.width=Math.ceil(pw*k)+"px";st.style.height=Math.ceil(r.offsetHeight*k)+"px";
 $("#pvzin").disabled=k>=PV_MAX-1e-3;$("#pvzout").disabled=k<=base+1e-3}
$("#pvzin").onclick=()=>{PVZ*=1.4;fit()};$("#pvzout").onclick=()=>{PVZ/=1.4;fit()};

}
