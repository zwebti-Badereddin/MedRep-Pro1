/* Doctor-visit facility choices (facility model V2): every option value is a facility ID. The doctor's linked facilities come
   first, then every other registered facility; picking one he is not linked to yet creates a link request for the administration. */
function workplaceChoices(doc,facilities){
 const on=w=>String(w.active)!=="false",own=((doc&&doc.workplaces)||[]).filter(on),mine=new Set(own.map(w=>String(w.id)));
 return {own,other:(facilities||[]).filter(w=>on(w)&&!mine.has(String(w.id)))};
}
function workplaceOptions(c){
 const o=(w,tag)=>'<option value="'+esc(w.id)+'" data-place="'+esc(w.workplace)+'">'+esc(w.workplace)+(tag||"")+(w.reviewed?'':' (الموقع بانتظار اعتماد الإدارة)')+'</option>';
 return c.own.map(w=>o(w,w.linked===false?' (الربط بانتظار الاعتماد)':'')).join("")+(c.other.length?'<optgroup label="منشآت مسجلة أخرى (يُطلب ربط الطبيب بها)">'+c.other.map(w=>o(w)).join("")+'</optgroup>':"")+'<option value="__new__">＋ اقتراح منشأة جديدة</option>';
}
function pickWorkplace(c,cur){
 const id=cur.facilityId,key=norm(cur.place),find=list=>(id&&list.find(w=>String(w.id)===String(id)))||(key&&list.find(w=>norm(w.workplace)===key))||null;
 const own=find(c.own);if(own)return {value:own.id,w:own,link:false};
 const other=find(c.other);return other?{value:other.id,w:other,link:true}:null;
}
function rememberWorkplace(rec,wp){
 const d=(CFG.docs||[]).find(x=>x.id===rec.id)||rec;d.workplaces=d.workplaces||[];
 if(!d.workplaces.some(w=>String(w.id)===String(wp.id)))d.workplaces.push({id:wp.id,workplace:wp.workplace,reviewed:wp.reviewed,linked:wp.linked});rec.workplaces=d.workplaces;
}

/* Free samples: a list of {product, qty}. Older visits stored up to two names in s1/s2 (one sample each). */
function normSamples(v){
 if(v&&Array.isArray(v.samples))return v.samples.filter(x=>x&&x.product&&x.product!=="—").map(x=>({product:String(x.product),qty:Math.max(1,Math.min(99,Math.round(+x.qty)||1))}));
 return [v&&v.s1,v&&v.s2].filter(x=>x&&x!=="—").map(p=>({product:String(p),qty:1}));
}
function mergeSamples(list){
 const m=new Map();
 (list||[]).forEach(x=>{if(!x||!x.product||x.product==="—")return;m.set(x.product,Math.min(99,(m.get(x.product)||0)+Math.max(1,Math.round(+x.qty)||1)))});
 return Array.from(m,([product,qty])=>({product,qty}));
}
function sampleText(v){
 return mergeSamples(normSamples(v)).map(x=>x.product+(x.qty>1?" ×"+x.qty:"")).join(" · ");
}

function vtFlagsC(v,all){
 if(!v||!v.ci||!v.co)return[];const out=[],a=Date.parse(v.ci.t),b=Date.parse(v.co.t);
 if(v.dur<2)out.push("زيارة قصيرة جدًا");if(v.dur>120)out.push("مدة طويلة غير معتادة");
 if(typeof v.ci.lat==="number"&&typeof v.co.lat==="number"&&typeof gpsDistanceMeters==="function"){const m=Math.round(gpsDistanceMeters(v.ci.lat,v.ci.lng,v.co.lat,v.co.lng));if(m>Math.max(200,(v.ci.acc||0)+(v.co.acc||0)))out.push("الخروج بعيد عن الدخول ("+m+" م)")}
 if(v.sk)out.push("ساعة الهاتف غير دقيقة ("+Math.abs(v.sk)+" د)");
 if((all||[]).some(x=>x!==v&&x&&x.ci&&x.co&&Math.min(b,Date.parse(x.co.t))-Math.max(a,Date.parse(x.ci.t))>60000))out.push("متداخلة مع زيارة أخرى");
 return out
}
// Report cell: "09:30 ← 09:44 · 14 دقيقة"; warnings only on the reviewer's view.
function vtCell(v,d){if(!v||!v.ci||!v.co)return"";const fl=d.adm?vtFlagsC(v,d.docs.concat(d.phs)):[];
 return '<div class="c"><small>الدخول والخروج</small>'+vtHM(v.ci.t)+' ← '+vtHM(v.co.t)+' · '+v.dur+' دقيقة'+(fl.length?'<div class="vtflag">⚠️ '+esc(fl.join(" · "))+'</div>':'')+'</div>'
}

/* Market information in a visit: competitor notes (both kinds), and for a pharmacy our products' stock / nearest expiry and the
   order as product × quantity (the old free-text order stays as a note). VX = the open form's state; collect() → visit fields. */
const COMP_T=[["price","سعر أقل"],["promo","عرض أو بونص"],["objection","اعتراض"],["shortage","نقص منتجنا"],["other","غير ذلك"]];
const STK_T=[["ok","متوفر"],["low","قليل"],["out","نفد"]];
const tName=(L,k)=>((L.find(x=>x[0]===k)||L[L.length-1])[1]);
function compTextC(v){
 return (v&&v.comp||[]).map(c=>c.p+" ("+tName(COMP_T,c.t)+")"+(c.n?": "+c.n:"")).join(" · ")
}
function stockTextC(v){
 return (v&&v.stock||[]).map(s=>s.product+": "+tName(STK_T,s.st)+(s.qty!=null&&s.qty!==""?" ("+s.qty+")":"")+(s.exp?" صلاحية "+s.exp:"")).join(" · ")
}
function orderTextC(v){
 const it=(v&&v.orderItems||[]).map(x=>x.product+" ×"+x.qty).join(" · ");return [it,v&&v.order].filter(Boolean).join(" — ")
}
function compNames(){let a=[];try{a=JSON.parse(localStorage.getItem("mr_comp_names")||"[]")}catch(e){}return a.slice(0,60)}
function visitExtrasHtml(k){
 const st=(n,t)=>'<div class="step"><span>'+n+'</span>'+t+' <small>(اختياري)</small></div>';
 return (k==="p"?st(3,"مخزون منتجاتنا في الصيدلية")+'<div id="f_stock"></div><button class="fchip add" type="button" id="f_stock_add">+ منتج</button>'+st(4,"أصناف الطلبية")+'<div id="f_oitems"></div><button class="fchip add" type="button" id="f_oitem_add">+ صنف في الطلبية</button>':"")+
  st(k==="p"?5:5,"المنافسون")+'<div id="f_comp"></div><button class="fchip add" type="button" id="f_comp_add">+ ملاحظة عن منتج منافس</button><datalist id="compNames">'+compNames().map(n=>'<option value="'+esc(n)+'">').join("")+'</datalist>'
}
function visitExtrasInit(k,cur){
 const S0=JSON.parse(JSON.stringify({comp:cur.comp||[],stock:cur.stock||[],oi:cur.orderItems||[]})),prods=()=>CFG.products||[];
 const sel=(L,v,cls,i)=>'<select class="'+cls+'" data-i="'+i+'">'+L.map(x=>'<option value="'+x[0]+'"'+(x[0]===v?" selected":"")+'>'+x[1]+'</option>').join("")+'</select>';
 const psel=(v,cls,i)=>'<select class="'+cls+'" data-i="'+i+'">'+opts(prods().indexOf(v)>=0||!v?prods():prods().concat([v]),v)+'</select>';
 const bind=(sel,fn)=>document.querySelectorAll(sel).forEach(e=>{e.oninput=e.onchange=()=>fn(+e.dataset.i,e.value)});
 const del=(sel,arr,draw)=>document.querySelectorAll(sel).forEach(b=>b.onclick=()=>{arr.splice(+b.dataset.i,1);draw()});
 const drawComp=()=>{const h=$("#f_comp");if(!h)return;h.innerHTML=S0.comp.map((c,i)=>'<div class="xrow"><input class="xc_p" data-i="'+i+'" list="compNames" placeholder="المنتج المنافس" value="'+esc(c.p||"")+'">'+sel(COMP_T,c.t||"price","xc_t",i)+'<button type="button" class="xdel xc_d" data-i="'+i+'" aria-label="حذف">×</button><input class="xc_n xwide" data-i="'+i+'" maxlength="200" placeholder="ماذا قيل؟ (اختياري)" value="'+esc(c.n||"")+'"></div>').join("");
  bind(".xc_p",(i,v)=>S0.comp[i].p=v);bind(".xc_t",(i,v)=>S0.comp[i].t=v);bind(".xc_n",(i,v)=>S0.comp[i].n=v);del(".xc_d",S0.comp,drawComp)};
 const drawStock=()=>{const h=$("#f_stock");if(!h)return;h.innerHTML=S0.stock.map((s,i)=>'<div class="xrow">'+psel(s.product,"xs_p",i)+sel(STK_T,s.st||"ok","xs_s",i)+'<button type="button" class="xdel xs_d" data-i="'+i+'" aria-label="حذف">×</button><label class="xlab">الكمية<input class="xs_q" data-i="'+i+'" type="number" min="0" inputmode="numeric" placeholder="اختياري" value="'+(s.qty==null?"":esc(s.qty))+'"></label><label class="xlab">أقرب صلاحية<input class="xs_e" data-i="'+i+'" type="month" value="'+esc(s.exp||"")+'"></label></div>').join("");
  bind(".xs_p",(i,v)=>S0.stock[i].product=v);bind(".xs_s",(i,v)=>S0.stock[i].st=v);bind(".xs_q",(i,v)=>S0.stock[i].qty=v);bind(".xs_e",(i,v)=>S0.stock[i].exp=v);del(".xs_d",S0.stock,drawStock)};
 const drawOi=()=>{const h=$("#f_oitems");if(!h)return;h.innerHTML=S0.oi.map((x,i)=>'<div class="xrow">'+psel(x.product,"xo_p",i)+'<input class="xo_q" data-i="'+i+'" type="number" min="1" inputmode="numeric" placeholder="الكمية" value="'+esc(x.qty||"")+'"><button type="button" class="xdel xo_d" data-i="'+i+'" aria-label="حذف">×</button></div>').join("");
  bind(".xo_p",(i,v)=>S0.oi[i].product=v);bind(".xo_q",(i,v)=>S0.oi[i].qty=v);del(".xo_d",S0.oi,drawOi)};
 const first=()=>{const p=$("#f_product")&&$("#f_product").value;return p&&p!=="—"?p:(prods()[0]||"")};
 if($("#f_comp_add"))$("#f_comp_add").onclick=()=>{S0.comp.push({p:"",t:"price",n:""});drawComp();const l=document.querySelectorAll(".xc_p");if(l.length)l[l.length-1].focus()};
 if($("#f_stock_add"))$("#f_stock_add").onclick=()=>{const used=S0.stock.map(s=>s.product),p=prods().find(x=>used.indexOf(x)<0&&x===first())||prods().find(x=>used.indexOf(x)<0)||first();S0.stock.push({product:p,st:"ok"});drawStock()};
 if($("#f_oitem_add"))$("#f_oitem_add").onclick=()=>{S0.oi.push({product:first(),qty:""});drawOi()};
 drawComp();drawStock();drawOi();
 return {collect:()=>{
  const comp=S0.comp.map(c=>({p:String(c.p||"").trim(),t:c.t||"other",n:String(c.n||"").trim()})).filter(c=>c.p.length>1).map(c=>c.n?c:{p:c.p,t:c.t});
  try{const old=compNames(),add=comp.map(c=>c.p).filter(p=>old.indexOf(p)<0);if(add.length)localStorage.setItem("mr_comp_names",JSON.stringify(add.concat(old).slice(0,60)))}catch(e){}
  const out={comp:comp.length?comp:undefined};
  if(k==="p"){
   const st=S0.stock.filter(s=>s.product&&s.product!=="—").map(s=>{const o={product:s.product,st:s.st||"ok"};if(s.qty!==""&&s.qty!=null&&isFinite(+s.qty))o.qty=Math.max(0,Math.round(+s.qty));if(/^\d{4}-\d{2}$/.test(s.exp||""))o.exp=s.exp;return o});
   const oi=S0.oi.map(x=>({product:x.product,qty:Math.round(+x.qty)})).filter(x=>x.product&&x.product!=="—"&&x.qty>=1);
   out.stock=st.length?st:undefined;out.orderItems=oi.length?oi:undefined}
  return out}}
}

/* Daily visit plan (set by a supervisor or an admin). DPRE = the plan item a visit is being opened from; the form preselects the
   doctor and the product and, for «أخذ انطباع», asks for the doctor's feedback. MYDP = the rep's plan items (kept on the phone). */
let DPRE=null;
const FB_T=[["pos","إيجابي"],["neu","محايد"],["neg","سلبي"]];
function fbTextC(v){
 return v&&v.fb?v.fb.product+": "+tName(FB_T,v.fb.r)+(v.fb.n?" — "+v.fb.n:""):""
}
function visitFbHtml(k,cur,pre){
 const fb=cur.fb||null,product=fb?fb.product:(pre&&pre.purpose==="feedback"?pre.product:"");if(k!=="d"||!product)return"";
 return '<div class="fbbox"><div class="step"><span>★</span>انطباع الطبيب عن <b>'+esc(product)+'</b></div>'+(pre&&pre.note?'<div class="dpnote">ملاحظة المشرف: '+esc(pre.note)+'</div>':'')+
  '<div class="seg fbseg">'+FB_T.map(x=>'<label><input type="radio" name="fb_r" value="'+x[0]+'"'+(fb&&fb.r===x[0]?" checked":"")+'><span>'+x[1]+'</span></label>').join("")+'</div>'+
  '<textarea id="fb_n" rows="2" maxlength="300" placeholder="ماذا قال الطبيب عن المنتج؟">'+esc(fb&&fb.n||"")+'</textarea><input type="hidden" id="fb_p" value="'+esc(product)+'"></div>'
}
function visitFbInit(k,cur,pre){
 if(pre&&pre.product&&k==="d"){const id=pre.purpose==="remind"?"f_remind":"f_intro",sel=$("#"+id);if(sel){if(![].some.call(sel.options,o=>o.value===pre.product))sel.appendChild(new Option(pre.product,pre.product));sel.value=pre.product}}
 const planId=(pre&&pre.planId)||cur.planId||"";
 return {collect:()=>{const o={planId:planId||undefined},r=document.querySelector("input[name=fb_r]:checked");
  if(r&&$("#fb_p"))o.fb={product:$("#fb_p").value,r:r.value,n:($("#fb_n").value||"").trim()||undefined};else o.fb=undefined;return o}}
}
let MYDP=null,MYDP_AT=0;
const dpKey=()=>"mr_dp_"+((rep&&rep.id)||"");
function dpLoad(){if(MYDP)return MYDP;try{MYDP=JSON.parse(localStorage.getItem(dpKey())||"null")}catch(e){MYDP=null}return MYDP}
function dpRefresh(force){if(!rep||rep.role!=="rep"||navigator.onLine===false)return;if(!force&&Date.now()-MYDP_AT<60000)return;MYDP_AT=Date.now();
 srv("myDayPlan").then(a=>{MYDP=a||[];try{localStorage.setItem(dpKey(),JSON.stringify(MYDP))}catch(e){}const c=$("#dpcard");if(c&&S){c.outerHTML=dayPlanCard();dpBind()}else if(!c&&S&&MYDP.some(x=>x.date===S.date)&&$("#app .rwrap"))home()}).catch(()=>{})}
function dpItems(){const a=(dpLoad()||[]).filter(x=>S&&x.date===S.date);
 return a.map(x=>Object.assign({},x,{done:x.status==="done"||(S.docs||[]).some(v=>v.planId===x.id||String(v.doctorId)===String(x.doctorId)||(!v.doctorId&&norm(v.name)===norm(x.doctorName)))}))}
function dayPlanCard(){
 const a=dpItems();if(!a.length)return'<div id="dpcard" hidden></div>';
 const done=a.filter(x=>x.done).length;
 return '<div id="dpcard" class="dpcard"><div class="dph"><b>خطة اليوم من المشرف</b><span>'+done+' من '+a.length+'</span></div>'+a.map(x=>'<div class="dpi'+(x.done?" ok":x.status==="failed"?" no":"")+'" data-dp="'+esc(x.id)+'">'+
  '<span class="dav dfig" aria-hidden="true">'+DOC_FIG+'</span><div class="dpt"><b>'+esc(x.doctorName)+'</b><small>'+esc(x.specialty||"")+(x.product?' · '+esc(x.purposeName)+': '+esc(x.product):'')+'</small>'+(x.note?'<small class="dpn">'+esc(x.note)+'</small>':'')+(x.status==="failed"&&!x.done?'<small class="dpn">تعذّرت: '+esc(x.reason)+'</small>':'')+'</div>'+
  (x.done?'<span class="dpok">تمت ✓</span>':locked()?'':'<div class="dpa"><button type="button" class="mini pri" data-a="go">زيارة</button>'+(x.status==="failed"?'<button type="button" class="mini" data-a="undo">تراجع</button>':'<button type="button" class="mini" data-a="fail">تعذّرت</button>')+'</div>')+'</div>').join("")+'</div>'
}
function dpBind(){
 document.querySelectorAll("#dpcard [data-a]").forEach(b=>b.onclick=()=>{const x=dpItems().find(i=>i.id===b.closest("[data-dp]").dataset.dp);if(!x)return;
  if(b.dataset.a==="go"){DPRE={rec:(CFG.docs||[]).find(d=>String(d.id)===String(x.doctorId))||{id:x.doctorId,name:x.doctorName,specialty:x.specialty,workplaces:[]},product:x.product,purpose:x.purpose,note:x.note,planId:x.id};form("d")}
  else if(b.dataset.a==="undo"){srv("dayPlanFail",{id:x.id,undo:true}).then(a=>{MYDP=a;home()}).catch(e=>toast(e.message))}
  else{$("#modal").innerHTML='<h3>تعذّرت زيارة '+esc(x.doctorName)+'</h3><label for="dp_r">السبب</label><input id="dp_r" maxlength="200" placeholder="مثلًا: الطبيب مسافر، العيادة مغلقة"><div class="err" id="dp_e"></div><div class="mfoot"><button type="button" class="btn" id="cx">إلغاء</button><button type="button" class="btn pri" id="sv">حفظ</button></div>';
   $("#ov").classList.add("on");$("#dp_r").focus();$("#cx").onclick=()=>$("#ov").classList.remove("on");
   $("#sv").onclick=async()=>{const b2=$("#sv");b2.disabled=true;try{MYDP=await srv("dayPlanFail",{id:x.id,reason:$("#dp_r").value});$("#ov").classList.remove("on");home()}catch(e){b2.disabled=false;$("#dp_e").textContent=e.message}}}})
}
</script>
